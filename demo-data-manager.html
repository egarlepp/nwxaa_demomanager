const VERTICAL_KEYS = Object.keys(VERTICAL_TEMPLATES);

// V2.6.8: Apply a vertical template to a cfg — returns new cfg with merged values.
// Non-destructive for global counts (userCount, groupCount, etc.) — only replaces names/structure.
const applyVerticalTemplate = (cfg, verticalKey) => {
  const tpl = VERTICAL_TEMPLATES[verticalKey];
  if (!tpl || verticalKey === 'generic') return {...cfg, global:{...cfg.global, vertical:verticalKey}};

  // 1) Global: domain + tenant
  const newGlobal = {
    ...cfg.global,
    vertical: verticalKey,
    domainName: tpl.domain?.name || cfg.global.domainName,
    domainFqdn: tpl.domain?.fqdn || cfg.global.domainFqdn,
    sidBase: tpl.domain?.sidBase || cfg.global.sidBase,
  };

  // 2) AD departments
  const newAd = {...cfg.ad, departments: tpl.departments || cfg.ad.departments};

  // 3) FS hosts/shares
  let newFs = cfg.fs;
  if (tpl.fsShares) {
    newFs = {...cfg.fs, hosts: tpl.fsShares.map(h => ({
      hostname: h.host,
      os: h.os,
      shares: h.shares.map(s => ({...s})),
    }))};
  }

  // 4) SPO tenants/sites
  let newSpo = cfg.spo;
  if (tpl.spoSites && tpl.spoTenant) {
    const mainUrl = `https://${tpl.spoTenant}.sharepoint.com`;
    const myUrl = `https://${tpl.spoTenant}-my.sharepoint.com`;
    const sites = tpl.spoSites.map(s => ({
      name: s.name,
      url: `${mainUrl}/sites/${s.pathSuffix}`,
      type: s.type,
      docs: s.docs,
      sensitiveRate: s.sensitiveRate,
      libraries: s.libraries,
    }));
    const odSites = (tpl.onedriveUsers || []).map(uname => ({
      name: `OneDrive - ${uname.replace(/_/g,' ')}`,
      url: `${myUrl}/personal/${uname.toLowerCase()}_${tpl.spoTenant}_${(tpl.domain?.fqdn||'').replace(/\./g,'_')}`,
      type: 'onedrive',
      docs: 40 + Math.floor(Math.random()*30),
      sensitiveRate: 30 + Math.floor(Math.random()*30),
      libraries: ['Documents'],
    }));
    newSpo = {...cfg.spo, tenants: [
      {url: mainUrl, sites: sites},
      {url: myUrl, sites: odSites},
    ]};
  }

  // 5) Sensitive data taxonomies — enable the ones in tpl.taxonomies
  let newSd = cfg.sd;
  if (tpl.taxonomies) {
    const enabledSet = new Set(tpl.taxonomies);
    newSd = {...cfg.sd, taxonomies: cfg.sd.taxonomies.map(t => ({
      ...t,
      enabled: enabledSet.has(t.name),
    }))};
  }

  return {...cfg, global:newGlobal, ad:newAd, fs:newFs, spo:newSpo, sd:newSd};
};

// v3.0 — Activity timestamp generator that respects business-hour patterns
// Returns a Date for the event, or null if the event should be skipped (e.g., weekend with weekendActivity off)
function pickActivityTime(baseNow, daysAgo, pattern){
  // If pattern is disabled, use the original uniform-random behavior
  if(!pattern||!pattern.enabled){
    return new Date(baseNow - daysAgo*864e5 - Math.floor(Math.random()*86400)*1000);
  }
  const date = new Date(baseNow - daysAgo*864e5);
  const dow = date.getDay(); // 0=Sun, 6=Sat
  const isWeekend = (dow===0||dow===6);
  // Filter weekends
  if(isWeekend && !pattern.weekendActivity) return null;
  // Pick an hour based on pattern settings
  let hour;
  const workStart = pattern.workStart||9;
  const workEnd = pattern.workEnd||17;
  if(isWeekend){
    // Weekend activity (admin/oncall): broad spread but lower-density during sleep hours
    if(Math.random()<0.4) hour = Math.floor(Math.random()*24);
    else hour = workStart + Math.floor(Math.random()*Math.max(1,workEnd-workStart));
  } else if(pattern.nightActivity && Math.random()<0.15){
    // 15% of events on night/evening hours (off-hours admin, service accounts, late workers)
    hour = Math.random()<0.5 ? Math.floor(Math.random()*workStart) : workEnd + Math.floor(Math.random()*(24-workEnd));
  } else {
    // Business hours — weight peaks around mid-morning and mid-afternoon
    const r = Math.random();
    if(r<0.25) hour = workStart + Math.floor(Math.random()*2); // early
    else if(r<0.55) hour = workStart + 1 + Math.floor(Math.random()*3); // mid-morning peak
    else if(r<0.85) hour = workEnd - 4 + Math.floor(Math.random()*3); // afternoon peak
    else hour = workEnd - 1 - Math.floor(Math.random()*2); // late
    hour = Math.max(workStart, Math.min(workEnd-1, hour));
  }
  // Lunch dip: 50% chance to shift away from noon hour
  if(pattern.lunchDip && hour===12 && Math.random()<0.5){
    hour = Math.random()<0.5 ? 11 : 13;
  }
  const minute = Math.floor(Math.random()*60);
  const second = Math.floor(Math.random()*60);
  date.setHours(hour, minute, second, 0);
  return date;
}
// Activity date generator: ~40% within last 7 days, rest spread over maxDays
const activityDate=(now,maxDays=180)=>{
  // V2.6.6: 60% in last 7 days, 20% in 7-30 days, 20% in 30-maxDays.
  // Aggressively recent so reports with default "Previous 7 days" filters populate immediately.
  const r=Math.random();
  let daysAgo;
  if(r<0.6) daysAgo=Math.floor(Math.random()*7);
  else if(r<0.8) daysAgo=7+Math.floor(Math.random()*23);
  else daysAgo=30+Math.floor(Math.random()*(maxDays-30));
  return new Date(now-daysAgo*864e5);
};
// ClickHouse type-aware default value for INSERT
const chDefault=(colType)=>{
  if(!colType)return `''`;
  if(colType==='UUID')return `'00000000-0000-0000-0000-000000000000'`;
  if(colType.startsWith('Int')||colType.startsWith('UInt')||colType.startsWith('Float')||colType.startsWith('Decimal'))return '0';
  if(colType==='Bool')return 'false';
  if(colType.startsWith('Map'))return '{}';
  if(colType.startsWith('Array'))return '[]';
  if(colType.startsWith('Tuple'))return 'tuple()';
  if(colType.startsWith('Nullable'))return 'NULL';
  if(colType.startsWith('Date')||colType.startsWith('DateTime'))return "'1970-01-01'";
  return `''`;
};

          const lim=Math.min(sh.files,50);
          // V2.6.8: vertical-aware file naming for v2 entities
          const vTplV2 = VERTICAL_TEMPLATES[cfg.global.vertical] || VERTICAL_TEMPLATES.generic;
          const vFileNamesV2 = vTplV2.fileNamePatterns;
          const mkV2FileName = (counter, ext) => {
            if (vFileNamesV2 && vFileNamesV2.length) return `${pick(vFileNamesV2)}_${counter}${ext}`;
            return `file_${counter}${ext}`;
          };
          for(let i=0;i<lim;i++){
            // v3.0 Web-Worker-lite: yield every 200 files at this scale
            if(i>0&&i%200===0){onProgress&&onProgress(`  v2 cifs ${sh.name}: ${i}/${lim}...`);await tick();}
            const ext=pick(Object.values(FILE_EXTS).flat());
            const fileBaseName=mkV2FileName(i+1,ext);
            const cifsStaleRoll=Math.random();
            const cifsDayOff=cifsStaleRoll<0.25?(365+Math.floor(Math.random()*730)):cifsStaleRoll<0.45?(90+Math.floor(Math.random()*275)):(1+Math.floor(Math.random()*89));
            const cifsModDate=new Date(now.getTime()-cifsDayOff*864e5).toISOString().replace('T',' ').slice(0,23)+'000';
            const cifsCreated=new Date(now.getTime()-(cifsDayOff+Math.floor(Math.random()*365))*864e5).toISOString().replace('T',' ').slice(0,23)+'000';
            const cifsAccessed=new Date(now.getTime()-Math.floor(Math.random()*cifsDayOff)*864e5).toISOString().replace('T',' ').slice(0,23)+'000';
            const cifsSizeBytes=1024+Math.floor(Math.random()*5e6);
            const cifsHash=Math.random()<0.15?pick(cifsHashPool):uuid().replace(/-/g,'').slice(0,12);
            const fileId=uuid();
            cifsFiles.push({id:fileId,parentId:shareEntityId});
            eRows.push(mkEntity({
              entityId:uq(fileId), sourceTypeId:uq(V2.stFsFile), name:q(fileBaseName), displayName:q(fileBaseName),
              tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS), sourceReference:uq(V2.tenancy),
              fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6), insertionTimeUtc:q(ts6),
              isDeleted:'false', parentId:uq(shareEntityId), isContainer:'false', hasContent:'true', isPathRoot:'false',
              pathSegment:q(fileBaseName), extension:q(ext.replace('.','')),
              createdDate:q(cifsCreated), modifiedDate:q(cifsModDate), lastAccessedDate:q(cifsAccessed),
              sizeBytes:cifsSizeBytes, contentHash:q(cifsHash), contentHashAlgorithm:q('MD5'),
            }));cifsCount++;
          }
        }
      }
      onProgress&&onProgress(`  ${cifsCount} CIFS entities (hosts+shares+files+empty shares+nested shares)`);
    }

    // --- AD Principal Entities (for entities table - some reports JOIN principals as entities) ---
    if(cfg.ad.enabled&&users.length){
      onProgress&&onProgress("  Generating AD principal entities...");
      for(const u of users){
        eRows.push(mkEntity({
          entityId:uq(uuid()), sourceTypeId:uq(V2.stAdUser), name:q(`${u.f} ${u.l}`), displayName:q(`${u.f} ${u.l}`),
          tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS), sourceReference:uq(V2.tenancy),
          fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6), insertionTimeUtc:q(ts6),
          isDeleted:'false', isContainer:'false', hasContent:'false', isPathRoot:'false',
          pathSegment:q(u.sam),
          adDistinguishedName:q(u.dn||''), adDomain:q(cfg.global.domainFqdn),
        }));
      }
      onProgress&&onProgress(`  ${users.length} AD principal entities`);
    }

    R.entities_v2={table:'entities',cols:eCols.join(','),rows:eRows};
    if(classRows.length)R.classifications={table:'classifications',cols:'entityId,classificationScheme,classificationId,classificationName,assignmentMethod,priority,isDeleted,tenancyReference,connectorReference,fullCrawlTimestampUtc,crawlTimestampUtc,contentVersion',rows:classRows};
    onProgress&&onProgress(`v2 Entity model: ${eRows.length} entities, ${classRows.length} classifications`);

    // Principals table — v2.5.1 schema-correct columns
    const userPrincipals=[], wellKnownPrincipals=[];
    if(cfg._schemas.principals){
      const pSchema=cfg._schemas.principals;
      const pCols=pSchema.map(c=>c.name);
      const pRows=[];
      const mkPrincipal=(fields)=>{
        const vals=pCols.map(col=>{
          if(fields[col]!==undefined)return fields[col];
          return chDefault((pSchema.find(c=>c.name===col)||{}).type||'');
        });
        return `(${vals.join(',')})`;
      };
      if(users.length){
        for(const u of users){
          const pid=uuid();
          // V2.6.13: ~10% of users are Guest (external) — needed for External Users/Domains reports
          const isGuestUser=Math.random()<0.1;
          const EXTERNAL_DOMAINS=['partner-consulting.com','vendorsupply.org','contractor-services.net','audit-firm.com','legal-advisors.co'];
          const userEmail=isGuestUser?`${u.sam}@${pick(EXTERNAL_DOMAINS)}`:`${u.sam}@${cfg.global.domainFqdn}`;
          userPrincipals.push({id:pid,sid:u.s,sam:u.sam,name:`${u.f} ${u.l}`,upn:`${u.sam}@${cfg.global.domainFqdn}`,isAdmin:u.adm,isGuest:isGuestUser});
          pRows.push(mkPrincipal({
            entityId:uq(pid), sourceTypeId:uq(V2.stAdUser), name:q(`${u.f} ${u.l}`), displayName:q(`${u.f} ${u.l}`),
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS), sourceReference:uq(V2.tenancy),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            isDeleted:'false', isContainer:'false', hasContent:'false', isPathRoot:'false',
            pathSegment:q(u.sam),
            sourceSystemId:q(u.s), sourceSystemIdType:q('SID'),
            firstName:q(u.f), lastName:q(u.l), emailAddress:q(userEmail),
            azureAdUserPrincipalName:q(`${u.sam}@${cfg.global.domainFqdn}`),
            azureAdUserType:isGuestUser?q('Guest'):q('Member'),
            adSamAccountName:q(u.sam), adDomain:q(cfg.global.domainFqdn),
            adDistinguishedName:q(u.dn||''),
            jobTitle:q(u.jobTitle||''), department:q(u.dept||''),
            isEnabled:u.en?'true':'false', isPrivileged:u.adm?'true':'false',
            isBuiltIn:'false', isSecurityEnabled:'true',
            disabled:u.en?'false':'true',
            // V2.6.2 fix: populate temporal fields that "New Users", "Stale Users", "Password Risk" reports filter on
            createdDate:q(u.cr+'.000000'),                          // when_created — NULL was blocking AD > New Users
            lastActive:u.lastLogon?q(u.lastLogon+'.000000'):'NULL', // for stale account reports
            passwordLastChanged:q(u.pwdLastSet+'.000000'),          // for password risk reports
          }));
        }
        // Well-known security principals — REQUIRED for Open Access / High-Risk ACL / SharingLinks reports
        const wkPrincipals=[
          {name:'Everyone',sid:'S-1-1-0',builtIn:true,sec:true},
          {name:'Authenticated Users',sid:'S-1-5-11',builtIn:true,sec:true},
          {name:'Anonymous Logon',sid:'S-1-5-7',builtIn:true,sec:true},
          {name:'Anonymous',sid:'S-1-5-7-ANON',builtIn:true,sec:true},
          {name:'Everyone except external users',sid:'c:0-.f|rolemanager|spo-grid-all-users|everyone-except-external',builtIn:false,sec:true},
          {name:'Domain Users',sid:`${cfg.global.sidBase}-513`,builtIn:false,sec:true},
          {name:'Domain Admins',sid:`${cfg.global.sidBase}-512`,builtIn:false,sec:true,priv:true},
          {name:'Administrators',sid:'S-1-5-32-544',builtIn:true,sec:true,priv:true},
          {name:'Users',sid:'S-1-5-32-545',builtIn:true,sec:true},
          {name:'SYSTEM',sid:'S-1-5-18',builtIn:true,sec:true},
          {name:'SharingLinks.Anonymous',sid:'c:0(.s|true',builtIn:false,sec:false},
          {name:'SharingLinks.Organization',sid:'c:0-.f|rolemanager|spo-grid-all-users',builtIn:false,sec:false},
          {name:'SharingLinks.Specific',sid:'c:0t.c|tenant|guests',builtIn:false,sec:false},
        ];
        for(const wk of wkPrincipals){
          const pid=uuid();
          wellKnownPrincipals.push({id:pid,sid:wk.sid,name:wk.name,priv:wk.priv});
          // V2.6.12: Add to BOTH principals AND entities tables.
          // entities_all (used by High-Risk ACL report) reads from entities, not principals.
          // Without an entities row, the report's risky_principals CTE finds nothing.
          eRows.push(mkEntity({
            entityId:uq(pid), sourceTypeId:uq(V2.stUnmanaged), name:q(wk.name), displayName:q(wk.name),
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS), sourceReference:uq(V2.tenancy),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6), insertionTimeUtc:q(ts6),
            isDeleted:'false', isContainer:'false', hasContent:'false', isPathRoot:'false',
            pathSegment:q(wk.name),
          }));
          pRows.push(mkPrincipal({
            entityId:uq(pid), sourceTypeId:uq(V2.stUnmanaged), name:q(wk.name), displayName:q(wk.name),
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS), sourceReference:uq(V2.tenancy),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            isDeleted:'false', isContainer:wk.sec?'true':'false', hasContent:'false', isPathRoot:'false',
            pathSegment:q(wk.name),
            sourceSystemId:q(wk.sid), sourceSystemIdType:q('SID'),
            isBuiltIn:wk.builtIn?'true':'false', isSecurityEnabled:wk.sec?'true':'false',
            isPrivileged:wk.priv?'true':'false', isEnabled:'true',
          }));
        }
      }
      R.principals_v2={table:'principals',cols:pCols.join(','),rows:pRows};
      onProgress&&onProgress(`v2 Principals: ${pRows.length} rows (${userPrincipals.length} users + ${wellKnownPrincipals.length} well-known)`);
    }

    // V2.6.0: Permissions table — explicit SKIP diagnostics + REAL schema with boolean flags + targetEntityId
    if(!cfg._schemas||!cfg._schemas.permissions){
      onProgress&&onProgress("  ⚠ v2 Permissions: SKIPPED — `permissions` schema not discovered. Run Discover Schemas first!");
    }else if(!userPrincipals.length&&!wellKnownPrincipals.length){
      onProgress&&onProgress("  ⚠ v2 Permissions: SKIPPED — no principals available (AD users empty?)");
    }else{
      onProgress&&onProgress("  Generating v2 permissions...");
      const permSchema=cfg._schemas.permissions;
      const permCols=permSchema.map(c=>c.name);
      const permRows=[];
      const mkPerm=(fields)=>{
        const vals=permCols.map(col=>{
          if(fields[col]!==undefined)return fields[col];
          return chDefault((permSchema.find(c=>c.name===col)||{}).type||'');
        });
        return `(${vals.join(',')})`;
      };
      // Permission flag templates — REAL boolean schema
      const PERM_READ={readAllowed:'true', writeAllowed:'false', deleteAllowed:'false', manageAllowed:'false', adminAllowed:'false', listAllowed:'true', limitedAccessAllowed:'true', accessMask:1179817, mask:1179817, role:"'Member'"};
      const PERM_WRITE={readAllowed:'true', writeAllowed:'true', deleteAllowed:'false', manageAllowed:'false', adminAllowed:'false', listAllowed:'true', limitedAccessAllowed:'true', accessMask:1245631, mask:1245631, role:"'Member'"};
      const PERM_FULL={readAllowed:'true', writeAllowed:'true', deleteAllowed:'true', manageAllowed:'true', adminAllowed:'true', listAllowed:'true', limitedAccessAllowed:'true', accessMask:2032127, mask:2032127, role:"'Owner'"};
      const PERM_READWRITE={readAllowed:'true', writeAllowed:'true', deleteAllowed:'true', manageAllowed:'false', adminAllowed:'false', listAllowed:'true', limitedAccessAllowed:'true', accessMask:1180063, mask:1180063, role:"'Member'"};
      const PERM_LIMITED={readAllowed:'false', writeAllowed:'false', deleteAllowed:'false', manageAllowed:'false', adminAllowed:'false', listAllowed:'false', limitedAccessAllowed:'true', accessMask:131209, mask:131209, role:"'Guest'"};
      const PERM_LEVELS=[PERM_READ,PERM_WRITE,PERM_FULL,PERM_READWRITE];

      // Well-known principal lookup
      const everyone=wellKnownPrincipals.find(w=>w.name==='Everyone');
      const authUsers=wellKnownPrincipals.find(w=>w.name==='Authenticated Users');
      const domainUsers=wellKnownPrincipals.find(w=>w.name==='Domain Users');
      const anonymous=wellKnownPrincipals.find(w=>w.name==='Anonymous Logon');
      const anonymousStandalone=wellKnownPrincipals.find(w=>w.name==='Anonymous');
      const everyoneExceptExternal=wellKnownPrincipals.find(w=>w.name==='Everyone except external users');
      const anonLink=wellKnownPrincipals.find(w=>w.name==='SharingLinks.Anonymous');
      const orgLink=wellKnownPrincipals.find(w=>w.name==='SharingLinks.Organization');

      const addPerm=(targetId, principalId, level, connRef, inherited=false)=>{
        permRows.push(mkPerm({
          tenancyReference:uq(V2.tenancy), connectorReference:uq(connRef),
          fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
          targetEntityId:uq(targetId), principalId:uq(principalId),
          permissionGrantId:q(uuid()),
          readAllowed:level.readAllowed, writeAllowed:level.writeAllowed, deleteAllowed:level.deleteAllowed,
          manageAllowed:level.manageAllowed, adminAllowed:level.adminAllowed, listAllowed:level.listAllowed,
          limitedAccessAllowed:level.limitedAccessAllowed,
          aceType:q(inherited?'AccessAllowedInherited':'AccessAllowed'),
          accessMask:level.accessMask, permissionMask:level.mask,
          inheritFlags:inherited?q('ContainerInherit,ObjectInherit'):q('None'),
          propagationFlags:q('None'),
          permissionTypes:'[]',
          memberRole:level.role,
        }));
      };

      // SPO permissions: sites get 3 user principals + maybe orgLink; libraries get 2-3 inherited; docs get 1-2 + maybe Everyone/Anon
      for(const ent of spoSites){
        const nUsers=2+Math.floor(Math.random()*2);
        for(let i=0;i<nUsers&&userPrincipals.length>0;i++)addPerm(ent.id, pick(userPrincipals).id, pick(PERM_LEVELS), V2.connSPO, false);
        if(Math.random()<0.30&&orgLink)addPerm(ent.id, orgLink.id, PERM_READ, V2.connSPO, false);
        if(Math.random()<0.10&&everyone)addPerm(ent.id, everyone.id, PERM_READ, V2.connSPO, false);
      }
      for(const ent of spoLibs){
        const nUsers=2+Math.floor(Math.random()*2);
        for(let i=0;i<nUsers&&userPrincipals.length>0;i++)addPerm(ent.id, pick(userPrincipals).id, pick(PERM_LEVELS), V2.connSPO, true);
        // V2.6.12: ~25% of LIBRARIES get Everyone/AuthUsers/EveryoneExceptExternal — containers need
        // open-access permissions too (not just docs) for Open Access and High-Risk ACL reports
        if(Math.random()<0.25){
          const containerOpenP=pick([everyone,authUsers,everyoneExceptExternal,orgLink].filter(Boolean));
          if(containerOpenP)addPerm(ent.id, containerOpenP.id, PERM_READ, V2.connSPO, false);
        }
        if(Math.random()<0.10){
          const containerRiskyP=pick([everyone,authUsers].filter(Boolean));
          const containerRiskyLvl=pick([PERM_WRITE,PERM_READWRITE,PERM_FULL]);
          if(containerRiskyP)addPerm(ent.id, containerRiskyP.id, containerRiskyLvl, V2.connSPO, false);
        }
      }
      for(const ent of spoDocs){
        const nUsers=1+Math.floor(Math.random()*2);
        for(let i=0;i<nUsers&&userPrincipals.length>0;i++)addPerm(ent.id, pick(userPrincipals).id, pick(PERM_LEVELS), V2.connSPO, true);
        // V2.6.9+12: Boost Open Access rate — include EveryoneExceptExternal + Anonymous standalone
        if(Math.random()<0.25){
          const openP=pick([everyone,anonymous,anonymousStandalone,anonLink,authUsers,everyoneExceptExternal].filter(Boolean));
          if(openP)addPerm(ent.id, openP.id, PERM_READ, V2.connSPO, false);
        }
        // V2.6.9+12: ~15% get HIGH-RISK ACL — Everyone/EveryoneExceptExternal with WRITE or FULL access
        if(Math.random()<0.15){
          const riskyP=pick([everyone,authUsers,everyoneExceptExternal].filter(Boolean));
          const riskyLvl=pick([PERM_WRITE,PERM_READWRITE,PERM_FULL]);
          if(riskyP)addPerm(ent.id, riskyP.id, riskyLvl, V2.connSPO, false);
        }
      }
      // CIFS permissions: shares + files get principals; ~15% of files get Everyone/AuthUsers/DomainUsers (High-Risk ACL)
      for(const ent of cifsShares){
        const nUsers=2+Math.floor(Math.random()*2);
        for(let i=0;i<nUsers&&userPrincipals.length>0;i++)addPerm(ent.id, pick(userPrincipals).id, pick(PERM_LEVELS), V2.connCIFS, false);
      }
      for(const ent of cifsFiles){
        const nUsers=2+Math.floor(Math.random()*2);
        for(let i=0;i<nUsers&&userPrincipals.length>0;i++)addPerm(ent.id, pick(userPrincipals).id, pick(PERM_LEVELS), V2.connCIFS, true);
        if(Math.random()<0.15){
          const riskyP=pick([everyone,authUsers,domainUsers].filter(Boolean));
          if(riskyP)addPerm(ent.id, riskyP.id, PERM_READWRITE, V2.connCIFS, false);
        }
      }
      R.permissions_v2={table:'permissions',cols:permCols.join(','),rows:permRows};
      onProgress&&onProgress(`v2 Permissions: ${permRows.length} grants (${spoSites.length+spoLibs.length+spoDocs.length} SPO + ${cifsShares.length+cifsFiles.length} CIFS entities)`);
    }

    // V2.6.0: Memberships table — explicit SKIP diagnostics
    if(!cfg._schemas||!cfg._schemas.memberships){
      onProgress&&onProgress("  ⚠ v2 Memberships: SKIPPED — `memberships` schema not discovered. Run Discover Schemas first!");
    }else if(!userPrincipals.length){
      onProgress&&onProgress("  ⚠ v2 Memberships: SKIPPED — no user principals");
    }else{
      onProgress&&onProgress("  Generating v2 memberships...");
      const memSchema=cfg._schemas.memberships;
      const memCols=memSchema.map(c=>c.name);
      const memRows=[];
      const mkMem=(fields)=>{
        const vals=memCols.map(col=>{
          if(fields[col]!==undefined)return fields[col];
          return chDefault((memSchema.find(c=>c.name===col)||{}).type||'');
        });
        return `(${vals.join(',')})`;
      };
      // Stable group-type UUIDs (consistent across the dataset)
      const GROUP_TYPE_SECURITY='5cb38a3f-1e8c-4d8c-9b85-5b7e3c8f9a01';
      const GROUP_TYPE_DISTRIBUTION='6dc49b4f-2f9d-5e9d-ac96-6c8f4d9fab02';
      const domainUsersP=wellKnownPrincipals.find(w=>w.name==='Domain Users');
      const adminsP=wellKnownPrincipals.find(w=>w.name==='Administrators');
      const domainAdminsP=wellKnownPrincipals.find(w=>w.name==='Domain Admins');
      const usersP=wellKnownPrincipals.find(w=>w.name==='Users');
      // Every user → Domain Users (direct)
      if(domainUsersP){
        for(const u of userPrincipals){
          memRows.push(mkMem({
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            memberId:uq(u.id), groupId:uq(domainUsersP.id), groupType:uq(GROUP_TYPE_SECURITY),
            membershipSource:q('Direct'), expandedFromGroupId:'NULL',
            role:"'Member'", memberSet:"'Members'",
          }));
        }
      }
      // Admin users → Administrators (direct) + Domain Admins (direct)
      const adminUsersList=userPrincipals.filter(u=>u.isAdmin);
      if(adminsP){
        for(const u of adminUsersList){
          memRows.push(mkMem({
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            memberId:uq(u.id), groupId:uq(adminsP.id), groupType:uq(GROUP_TYPE_SECURITY),
            membershipSource:q('Direct'), expandedFromGroupId:'NULL',
            role:"'Owner'", memberSet:"'Members'",
          }));
        }
      }
      if(domainAdminsP){
        for(const u of adminUsersList){
          memRows.push(mkMem({
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            memberId:uq(u.id), groupId:uq(domainAdminsP.id), groupType:uq(GROUP_TYPE_SECURITY),
            membershipSource:q('Direct'), expandedFromGroupId:'NULL',
            role:"'Owner'", memberSet:"'Members'",
          }));
        }
      }
      // Nested: Domain Admins → Administrators (group nested in group, surfaces as expanded membership)
      if(adminsP&&domainAdminsP){
        for(const u of adminUsersList){
          memRows.push(mkMem({
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            memberId:uq(u.id), groupId:uq(adminsP.id), groupType:uq(GROUP_TYPE_SECURITY),
            membershipSource:q('Nested'), expandedFromGroupId:uq(domainAdminsP.id),
            role:"'Owner'", memberSet:"'Members'",
          }));
        }
      }
      R.memberships_v2={table:'memberships',cols:memCols.join(','),rows:memRows};
      onProgress&&onProgress(`v2 Memberships: ${memRows.length} rows (${adminUsersList.length} admins)`);
    }

    // V2.6.0: Ownerships table — entity → owner mappings
    if(!cfg._schemas||!cfg._schemas.ownerships){
      onProgress&&onProgress("  ⚠ v2 Ownerships: SKIPPED — `ownerships` schema not discovered");
    }else if(!userPrincipals.length){
      onProgress&&onProgress("  ⚠ v2 Ownerships: SKIPPED — no user principals");
    }else{
      onProgress&&onProgress("  Generating v2 ownerships...");
      const owSchema=cfg._schemas.ownerships;
      const owCols=owSchema.map(c=>c.name);
      const owRows=[];
      const mkOwn=(fields)=>{
        const vals=owCols.map(col=>{
          if(fields[col]!==undefined)return fields[col];
          return chDefault((owSchema.find(c=>c.name===col)||{}).type||'');
        });
        return `(${vals.join(',')})`;
      };
      // Stable ownerType UUIDs (per source family)
      const OWNER_TYPE_USER='9a3e5d8f-7b6c-4e2d-a1f3-8c9d2e4f5a6b';
      const OWNER_TYPE_GROUP='ab4f6e9a-8c7d-5f3e-b2a4-9dae3f5b6c7d';
      // Every SPO doc + CIFS file gets a random user as owner
      const ownableEntities=[
        ...spoDocs.map(e=>({...e,conn:V2.connSPO})),
        ...spoLibs.map(e=>({...e,conn:V2.connSPO})),
        ...cifsFiles.map(e=>({...e,conn:V2.connCIFS})),
        ...cifsShares.filter(e=>!e.nested).map(e=>({...e,conn:V2.connCIFS})),
      ];
      for(const ent of ownableEntities){
        const owner=pick(userPrincipals);
        if(!owner)continue;
        owRows.push(mkOwn({
          entityId:uq(ent.id), ownerId:uq(owner.id), ownerType:uq(OWNER_TYPE_USER),
          isDeleted:'false',
          tenancyReference:uq(V2.tenancy), connectorReference:uq(ent.conn),
          fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6),
        }));
      }
      R.ownerships_v2={table:'ownerships',cols:owCols.join(','),rows:owRows};
      onProgress&&onProgress(`v2 Ownerships: ${owRows.length} entity-owner pairs`);
    }

    // V2.6.0: Permission Sets table — sharing links + role definitions
    // V2.6.12: PST constants hoisted so both permission_sets AND permission_grant_rules blocks can reference them

function buildSQL(R,db="access_analyzer"){const G={};for(const[k,v]of Object.entries(R)){if(!v.table)continue;if(!G[v.table])G[v.table]={c:v.cols,r:[]};G[v.table].r=G[v.table].r.concat(v.rows);}
const F={};for(const[t,d]of Object.entries(G)){let s=`-- ${t}: ${d.r.length} rows\n\n`;for(let i=0;i<d.r.length;i+=500){s+=`INSERT INTO ${db}.${t} (${d.c}) VALUES\n${d.r.slice(i,i+500).join(",\n")};\n\n`;}F[`${t}.sql`]=s;}return F;}

/* ─── ClickHouse HTTP Client ──────────────────────────── */
async function chQuery(cfg, sql) {
  const {ch_host, ch_port, ch_user, ch_pass} = cfg.connection;
  const url = `http://${ch_host}:${ch_port}/?database=access_analyzer&user=${encodeURIComponent(ch_user)}&password=${encodeURIComponent(ch_pass)}`;
  const resp = await fetch(url, {method: 'POST', body: sql, mode: 'cors'});
  if (!resp.ok) { const t = await resp.text(); throw new Error(`CH ${resp.status}: ${t.slice(0,200)}`); }
  return await resp.text();
}
async function chTest(cfg) {
  try { const r = await chQuery(cfg, "SELECT currentUser() as u, version() as v"); return {ok:true, data:r.trim()}; }
  catch(e) { return {ok:false, error:e.message}; }
}
async function chGrant(cfg) {
  try { await chQuery(cfg, "GRANT INSERT, TRUNCATE, ALTER DELETE, ALTER UPDATE ON access_analyzer.* TO access_analyzer_metabase"); return {ok:true}; }
  catch(e) { return {ok:false, error:e.message}; }
}

// Metabase API injection (preferred path — no CORS issues)
async function mbInject(cfg, sql) {
  const sid = cfg.connection._mbSession;
  if (!sid) throw new Error("No Metabase session. Connect first.");
  const resp = await fetch(cfg.connection.url + '/metabase/api/dataset', {
    method:'POST', headers:{'Content-Type':'application/json','X-Metabase-Session':sid},
    body:JSON.stringify({database:2, type:'native', native:{query:sql}})
  });
  const d = await resp.json();
  if (d.status==='failed' && d.error && d.error.indexOf('ResultSet')>=0) return {ok:true};
  if (d.status==='failed') throw new Error(d.error);
  return {ok:true, data:d.data};
}

// Schema discovery — queries ClickHouse system.columns for unknown tables
async function mbDiscoverSchema(cfg, tableName) {
  const sid = cfg.connection._mbSession;
  if (!sid) throw new Error("No Metabase session");
  const sql = `SELECT name, type, default_kind FROM system.columns WHERE table='${tableName}' AND database='access_analyzer' ORDER BY position`;
  const resp = await fetch(cfg.connection.url + '/metabase/api/dataset', {
    method:'POST', headers:{'Content-Type':'application/json','X-Metabase-Session':sid},
    body:JSON.stringify({database:2, type:'native', native:{query:sql}})
  });
  const d = await resp.json();
  if (d.status==='failed') throw new Error(d.error||'Query failed');
  if (!d.data||!d.data.rows||d.data.rows.length===0) return null;
  // Filter out MATERIALIZED and ALIAS columns — they can't be inserted
  return d.data.rows
    .filter(r => !r[2] || (r[2]!=='MATERIALIZED' && r[2]!=='ALIAS'))
    .map(r=>({name:r[0],type:r[1]}));
}

async function mbDiscoverAllSchemas(cfg) {
  const tables = ['active_directory_risk_catalog','entities','principals','permissions','memberships','system_objects','permission_sets','permission_grant_rules','ownerships','sensitive_data','netwrix_activity_monitor_copilot','sharepoint_online_shared_links','crawl_completions'];
  const schemas = {};
  for (const t of tables) {
    try {
      const s = await mbDiscoverSchema(cfg, t);
      if (s) schemas[t] = s;
    } catch(e) { /* table may not exist */ }
  }
  return schemas;
}

// v2.5.2: Full-database introspection — lists EVERY table in access_analyzer with row counts + columns
// Use this to find tables we haven't accounted for (Copilot, Entra ID, M365 audit, materialized views, etc.)
async function mbDiscoverEverything(cfg, onProgress) {
  const sid = cfg.connection._mbSession;
  if (!sid) throw new Error("No Metabase session");
  const runSql = async (sql) => {
    const resp = await fetch(cfg.connection.url + '/metabase/api/dataset', {
      method:'POST', headers:{'Content-Type':'application/json','X-Metabase-Session':sid},
      body:JSON.stringify({database:2, type:'native', native:{query:sql}})
    });
    const d = await resp.json();
    if (d.status==='failed') throw new Error(d.error||'Query failed');
    return d.data && d.data.rows ? d.data.rows : [];
  };

  onProgress&&onProgress("Listing all tables...");
  // Get all tables + row counts + engine + size
  const tableRows = await runSql(
    `SELECT name, total_rows, total_bytes, engine FROM system.tables WHERE database='access_analyzer' ORDER BY name`
  );
  onProgress&&onProgress(`Found ${tableRows.length} tables. Fetching all columns in one query...`);

  // Get ALL columns for ALL tables in ONE query (way faster than per-table)
  const colRows = await runSql(
    `SELECT table, name, type, default_kind, position FROM system.columns WHERE database='access_analyzer' ORDER BY table, position`
  );
  onProgress&&onProgress(`Got ${colRows.length} columns. Building report...`);

  // Group columns by table
  const colsByTable = {};
  for (const r of colRows) {
    const [tbl, name, type, defKind] = r;
    if (!colsByTable[tbl]) colsByTable[tbl] = [];
    // Skip MATERIALIZED/ALIAS — they can't be inserted
    if (defKind === 'MATERIALIZED' || defKind === 'ALIAS') continue;
    colsByTable[tbl].push({name, type});
  }

  // V2.7.1: Tables our generator knows how to populate (base tables only).
  // Anything that's a View, MaterializedView, Dictionary, or derivative (_latest, _mv, etc.)
  // is excluded from "unknown" since AA26 populates those automatically from our base data.
  const KNOWN_TABLES = new Set([
    'active_directory_user','active_directory_group','active_directory_group_membership','active_directory_effective_group_membership','active_directory_risk_catalog',
    'cifs_object','cifs_permission','cifs_share_permission','cifs_sensitive_data',
    'sharepoint_online_objects','sharepoint_online_permissions','sharepoint_online_shared_links','sharepoint_sensitive_data',
    'netwrix_activity_monitor_json','netwrix_activity_monitor_spo','netwrix_activity_monitor_copilot',
    'localgroups_group','localgroups_user','localgroups_group_members','localgroups_effective_group_membership',
    'entities','principals','permissions','permission_sets','permission_grant_rules','memberships','ownerships','sensitive_data','classifications','crawl_completions','system_objects',
    // V2.7.1: AA26-shipped seed tables — ship with data, we don't populate but they're not gaps
    'domain_type_properties','path_metadata','permission_calc_rules','source_type_registry','source_settings',
    // Optional features we don't currently demo but don't block any reports
    'active_directory_user_custom_attribute','netwrix_activity_monitor_leef',
  ]);

  // Build the final report — filter out tables that are derivatives/internals, not base tables
  const allTableNames = tableRows.map(r => r[0]);
  const unknownTables = tableRows.filter(r => {
    const name = r[0];
    const engine = r[3] || '';
    // Skip if in known list
    if (KNOWN_TABLES.has(name)) return false;
    // Skip ClickHouse internals
    if (name.startsWith('.inner') || name.startsWith('_tmp_')) return false;
    // Skip views, MVs, dictionaries — these derive from base tables AA26 manages automatically
    if (engine === 'View' || engine === 'MaterializedView' || engine === 'LiveView' || engine === 'Dictionary') return false;
    // Skip naming conventions for derivatives that AA26 maintains
    if (/_latest$|_mv$|_resolved$|_summary$|_summary_mv$|_by_domain$|_by_domain_mv$|_with_path$|_member_counts$|_mip_labels(_latest|_summary)?$/.test(name)) return false;
    // Skip schema/version tracking
    if (name === 'schema_migrations' || name === 'schema_versions') return false;
    return true;
  }).map(r => r[0]);
  const report = {
    database: 'access_analyzer',
    totalTables: tableRows.length,
    totalColumns: colRows.length,
    summary: {
      populated: tableRows.filter(r => Number(r[1])>0).length,
      empty: tableRows.filter(r => !r[1] || Number(r[1])===0).length,
      copilotTables: tableRows.filter(r => /copilot/i.test(r[0])).map(r=>r[0]),
      m365Tables: tableRows.filter(r => /m365|microsoft365|entra|azure_ad/i.test(r[0])).map(r=>r[0]),
      materializedViews: tableRows.filter(r => r[3]==='MaterializedView').map(r=>r[0]),
      dictionaries: tableRows.filter(r => r[3]==='Dictionary').map(r=>r[0]),
      unknownTables: unknownTables,
    },
    tables: tableRows.map(r => ({
      name: r[0],
      rowCount: r[1] ? Number(r[1]) : 0,
      bytes: r[2] ? Number(r[2]) : 0,
      engine: r[3],
      columns: colsByTable[r[0]] || [],
    })),
  };
  return report;
}

async function aa26Fetch(cfg, path, opts={}) {
  const host = cfg.connection?.aa26Host || cfg.connection.host;
  const cookie = cfg.connection?.aa26SessionCookie || "";
  // V2.8.0-alpha refinement: same-origin auto-mode — browser auto-attaches cookies
  const isSameOrigin = typeof window !== "undefined" && window.location.hostname === host;
  if (!cookie && !isSameOrigin) throw new Error("AA26 session cookie not set (or host this app on the AA26 origin for auto-auth)");
  const url = isSameOrigin ? path : `https://${host}${path}`;
  const headers = { "Content-Type":"application/json", ...(opts.headers||{}) };
  // Only set Cookie header in cross-origin mode (browser blocks setting it manually otherwise)
  if (!isSameOrigin && cookie) headers["Cookie"] = `_dspm_session=${cookie}`;
  const r = await fetch(url, {
    method: opts.method || "GET",
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: "include",
  });
  const txt = await r.text();
  let body=null; try{ body=JSON.parse(txt); }catch{ body=txt; }
  return { status: r.status, ok: r.ok, body };
}

async function aa26VerifySession(cfg) {
  try {
    const r = await aa26Fetch(cfg, "/api/v1/auth/me");
    if (r.ok && r.body?.user) return { ok:true, user:r.body.user };
    return { ok:false, error:`HTTP ${r.status}: ${r.body?.message || "Invalid session"}` };
  } catch(e) { return { ok:false, error:e.message }; }
}

// V2.8.0: Simulate a completed scan execution for the given scan_id.
// API gotcha: timestamps and object counts are server-controlled and ignored on input.
// The state machine requires pending -> running -> completed transitions in sequence.
async function aa26SimulateExecution(cfg, scanId, scanType) {
  const create = await aa26Fetch(cfg, "/api/v1/scan-executions", { method:"POST", body: { scan_id: scanId } });
  if (!create.ok) return { ok:false, error:`create failed: ${create.status} ${JSON.stringify(create.body).slice(0,120)}` };
  const execId = create.body.id;
  const toRunning = await aa26Fetch(cfg, `/api/v1/scan-executions/${execId}`, { method:"PATCH", body: { status: "running" } });
  if (!toRunning.ok) return { ok:false, error:`pending→running failed: ${toRunning.status}`, execId };
  const toCompleted = await aa26Fetch(cfg, `/api/v1/scan-executions/${execId}`, { method:"PATCH", body: { status: "completed" } });
  if (!toCompleted.ok) return { ok:false, error:`running→completed failed: ${toCompleted.status}`, execId };
  return { ok:true, execId };
}

// ── AA26 Config: Generate post-setup SQL command for Postgres fixup
// Dynamically builds kubectl one-liner using real UUIDs from the orchestrator run.
function aa26GeneratePostSetupSQL(sourceNames, executions, cfg) {
  // Part 1: Create source groups and link sources
  const sgSQL = sourceNames.map(name =>
    `INSERT INTO source_groups (id,name,description,max_concurrent_scans,status,service_account_id,source_type_id,created_at,updated_at) ` +
    `SELECT gen_random_uuid(),'${name}','Demo source group',1,'active',s.service_account_id,s.source_type_id,s.created_at,s.created_at ` +
    `FROM sources s WHERE s.name='${name}' AND NOT EXISTS (SELECT 1 FROM source_groups sg WHERE sg.name='${name}');\n` +
    `UPDATE sources SET source_group_id=sg.id FROM source_groups sg WHERE sources.name='${name}' AND sg.name='${name}' AND sources.source_group_id IS NULL;`
  ).join("\n");

  // Part 2: Backdate the API-created execution to be "the latest" AND generate
  // N historical clones spread back over the configured history window.
  // v3.0: Multi-execution history per scan — populates trend charts in dashboards
  const scanTypeProfiles = {
    sync:                { durationMin:8, durationMax:25, objectsMin:600, objectsMax:1500 },
    access_scan:         { durationMin:35, durationMax:70, objectsMin:3000, objectsMax:6000 },
    sensitive_data_scan: { durationMin:300, durationMax:900, objectsMin:1500, objectsMax:4000 },
  };
  const historyDays = (cfg?.global?.historyMonths || 2) * 30;
  const scanFreq = cfg?.global?.scanFreqDays || 14;
  // Number of historical clones per scan — capped at 7 for performance
  const histCount = Math.max(2, Math.min(7, Math.floor(historyDays / scanFreq) - 1));
  const fmtTs = d => d.toISOString().replace('T',' ').slice(0,19);

  const sqlLines = [];
  executions.forEach((ex, i) => {
    const prof = scanTypeProfiles[ex.scan_type] || scanTypeProfiles.sync;
    const baseObjs = prof.objectsMin + Math.floor(Math.random() * (prof.objectsMax - prof.objectsMin));

    // The API-created execution becomes "the latest" — 1-3 days ago
    const latestStart = new Date();
    latestStart.setDate(latestStart.getDate() - (1 + Math.floor(Math.random() * 2)));
    latestStart.setHours(6 + (i % 8), Math.floor(Math.random()*60), 0, 0);
    const dur = prof.durationMin + Math.floor(Math.random() * (prof.durationMax - prof.durationMin));
    const latestEnd = new Date(latestStart.getTime() + dur * 1000);

    sqlLines.push(`UPDATE scan_executions SET started_at='${fmtTs(latestStart)}',created_at='${fmtTs(latestStart)}',` +
      `completed_at='${fmtTs(latestEnd)}',updated_at='${fmtTs(latestEnd)}',` +
      `total_objects=${baseObjs},completed_objects=${baseObjs} WHERE id='${ex.execId}';`);

    // Historical clones — each one scanFreq days older, with gradual object-count growth
    for (let h = 1; h <= histCount; h++) {
      const histStart = new Date(latestStart.getTime() - h * scanFreq * 86400000);
      histStart.setHours(6 + (i % 8), Math.floor(Math.random()*60), 0, 0);
      const histDur = prof.durationMin + Math.floor(Math.random() * (prof.durationMax - prof.durationMin));
      const histEnd = new Date(histStart.getTime() + histDur * 1000);
      // Older = smaller: ~5% growth per scan period, ±10% noise. Floor at 100.
      const growthFactor = Math.max(0.5, 1 - (h * 0.05));
      const histObjs = Math.max(100, Math.floor(baseObjs * growthFactor * (0.9 + Math.random()*0.2)));

      sqlLines.push(
        `INSERT INTO scan_executions (id, scan_id, scan_type, source_id, status, started_at, completed_at, created_at, updated_at, total_objects, completed_objects) ` +
        `SELECT gen_random_uuid(), scan_id, scan_type, source_id, 'completed', ` +
        `'${fmtTs(histStart)}'::timestamp, '${fmtTs(histEnd)}'::timestamp, ` +
        `'${fmtTs(histStart)}'::timestamp, '${fmtTs(histEnd)}'::timestamp, ` +
        `${histObjs}, ${histObjs} ` +
        `FROM scan_executions WHERE id='${ex.execId}';`
      );
    }
  });

  const totalNewRows = executions.length * histCount;
  const execSQL = `-- Backdating ${executions.length} latest executions + cloning ${totalNewRows} historical executions\n` + sqlLines.join("\n");

  const sql = `BEGIN;\n${sgSQL}\n${execSQL}\nCOMMIT;`;
  const cmd = `kubectl exec -i postgres-0 -n access-analyzer -- psql -U postgres -d access_analyzer << 'EOSQL'\n${sql}\nEOSQL`;
  return { sql, cmd, summary: { latestUpdated: executions.length, historicalAdded: totalNewRows, historyDays, scanFreq } };
}

// ── AA26 Config: Wipe configuration (reverse dependency order)
// mode="demo" — only items matching config plan names + any source groups with matching names
// mode="all"  — ALL configuration content (complete clean slate, preserves service accounts only)
async function aa26WipeConfig(cfg, log, mode="demo") {
  const plan = aa26ConfigPlan(cfg);
  const demoSourceNames = new Set(plan.sources.map(s => s.name));
  const demoScanNames = new Set(plan.scans.map(s => s.name));
  const stats = { execDel:0, scanDel:0, srcDel:0, sgDel:0, errors:0 };
  const isAll = mode === "all";
  log(isAll ? "Mode: FULL — wiping ALL configuration content" : "Mode: DEMO — wiping demo-created items only");

  // Phase 1: Delete scan executions
  log("→ Wiping scan executions...");
  const allScans = await aa26GetScans(cfg);
  const targetScans = isAll ? allScans : allScans.filter(s => demoScanNames.has(s.name));
  for (const scan of targetScans) {
    const execs = await aa26GetScanExecutions(cfg, scan.id);
    for (const ex of execs) {
      const r = await aa26DeleteScanExecution(cfg, ex.id);
      if (r.ok || r.status === 204) { log(`  ✓ Deleted execution ${ex.id.slice(0,8)} (${scan.name})`); stats.execDel++; }
      else { log(`  ✗ Failed to delete execution ${ex.id.slice(0,8)}: HTTP ${r.status}`); stats.errors++; }
    }
  }

  // Phase 2: Delete scans
  log("→ Wiping scans...");
  for (const scan of targetScans) {
    const r = await aa26DeleteScan(cfg, scan.id);
    if (r.ok || r.status === 204) { log(`  ✓ Deleted scan "${scan.name}"`); stats.scanDel++; }
    else { log(`  ✗ Failed to delete scan "${scan.name}": HTTP ${r.status}`); stats.errors++; }
  }

  // Phase 3: Delete sources
  log("→ Wiping sources...");
  const allSources = await aa26GetSources(cfg);
  const targetSources = isAll ? allSources : allSources.filter(s => demoSourceNames.has(s.name));
  for (const src of targetSources) {
    const r = await aa26DeleteSource(cfg, src.id);
    if (r.ok || r.status === 204) { log(`  ✓ Deleted source "${src.name}"`); stats.srcDel++; }
    else { log(`  ✗ Failed to delete source "${src.name}": HTTP ${r.status}`); stats.errors++; }
  }

  // Phase 4: Delete source groups
  log("→ Wiping source groups...");
  const sgResp = await aa26Fetch(cfg, "/api/v1/source-groups?per_page=100");
  const allSGs = sgResp.ok ? (sgResp.body.data || []) : [];
  const targetSGs = isAll ? allSGs : allSGs.filter(sg => demoSourceNames.has(sg.name) || demoScanNames.has(sg.name));
  for (const sg of targetSGs) {
    const r = await aa26DeleteSourceGroup(cfg, sg.id);
    if (r.ok || r.status === 204) { log(`  ✓ Deleted source group "${sg.name}"`); stats.sgDel++; }
    else if (r.status === 409) { log(`  ⊘ Source group "${sg.name}" has dependencies — may need sources deleted first`); stats.errors++; }
    else { log(`  ✗ Failed to delete source group "${sg.name}": HTTP ${r.status}`); stats.errors++; }
  }

  log("");
  // Phase 5: Delete service accounts (Full Reset only)
  stats.saDel = 0;
  if (isAll) {
    log("→ Wiping service accounts...");
    const allSAs = await aa26GetServiceAccounts(cfg);
    for (const sa of allSAs) {
      const r = await aa26DeleteServiceAccount(cfg, sa.id);
      if (r.ok || r.status === 204) { log(`  ✓ Deleted service account "${sa.name}"`); stats.saDel++; }
      else if (r.status === 409) { log(`  ⊘ Service account "${sa.name}" has dependencies — delete sources first`); stats.errors++; }
      else { log(`  ✗ Failed to delete service account "${sa.name}": HTTP ${r.status}`); stats.errors++; }
    }
  }

  log("");
  log(`Done. Deleted: ${stats.execDel} executions, ${stats.scanDel} scans, ${stats.srcDel} sources, ${stats.sgDel} source groups${isAll?`, ${stats.saDel} service accounts`:""}`);
  if (!isAll) log("Note: Service accounts preserved in Demo mode. Use Full Reset to remove them.");
  if (stats.errors > 0) log(`⚠ ${stats.errors} errors — review log above`);
  return stats;
}

// Orchestrates the full config: creates SAs, then Sources, then Scans, with idempotency
async function aa26RunFullConfig(cfg, log) {
  const plan = aa26ConfigPlan(cfg);
  const stats = { saCreated: 0, saSkipped: 0, srcCreated: 0, srcSkipped: 0, scnCreated: 0, scnSkipped: 0, errors: 0 };

  // ── Service Accounts
  log(`→ Phase 1/5: Service Accounts (${plan.serviceAccounts.length})`);
  const existingSAs = await aa26GetServiceAccounts(cfg);
  const saNameToId = {};
  existingSAs.forEach(s => { saNameToId[s.name] = s.id; });
  for (const sa of plan.serviceAccounts) {
    if (saNameToId[sa.name]) { log(`  ⊘ Service Account "${sa.name}" exists (${saNameToId[sa.name]})`); stats.saSkipped++; continue; }
    const r = await aa26CreateServiceAccount(cfg, sa);
    if (r.ok) { saNameToId[sa.name] = r.body.id; log(`  ✓ Created "${sa.name}" (${r.body.id})`); stats.saCreated++; }
    else { log(`  ✗ Failed "${sa.name}": HTTP ${r.status} — ${JSON.stringify(r.body).slice(0,180)}`); stats.errors++; }
  }

  // ── Sources
  log(`→ Phase 2/5: Source Groups (${plan.sources.length})`);
  const existingSrcs = await aa26GetSources(cfg);
  const srcNameToId = {};
  existingSrcs.forEach(s => { srcNameToId[s.name] = s.id; });
  for (const src of plan.sources) {
    if (srcNameToId[src.name]) { log(`  ⊘ Source "${src.name}" exists (${srcNameToId[src.name]})`); stats.srcSkipped++; continue; }
    const saId = saNameToId[src.serviceAccountName];
    if (!saId) { log(`  ✗ Source "${src.name}": missing service account "${src.serviceAccountName}"`); stats.errors++; continue; }
    const sourceTypeId = AA26_SOURCE_TYPES[src.sourceTypeKey];
    if (!sourceTypeId) { log(`  ✗ Source "${src.name}": unknown source type "${src.sourceTypeKey}"`); stats.errors++; continue; }
    const payload = { name: src.name, sourceTypeId, serviceAccountId: saId, connectionParameters: src.connectionParameters };
    const r = await aa26CreateSource(cfg, payload);
    if (r.ok) { srcNameToId[src.name] = r.body.id; log(`  ✓ Created "${src.name}" (${r.body.id})`); stats.srcCreated++; }
    else { log(`  ✗ Failed "${src.name}": HTTP ${r.status} — ${JSON.stringify(r.body).slice(0,180)}`); stats.errors++; }
  }

  // ── Scans
  log(`→ Phase 3/5: Scans (${plan.scans.length})`);
  const existingScans = await aa26GetScans(cfg);
  const scanByName = {};
  existingScans.forEach(s => { scanByName[s.name] = s; });
  const createdScanIds = [];
  for (const scn of plan.scans) {
    if (scanByName[scn.name]) { log(`  ⊘ Scan "${scn.name}" exists`); stats.scnSkipped++; createdScanIds.push({id: scanByName[scn.name].id, name: scn.name, scan_type: scn.scan_type}); continue; }
    const srcId = srcNameToId[scn.sourceName];
    if (!srcId) { log(`  ✗ Scan "${scn.name}": missing source "${scn.sourceName}"`); stats.errors++; continue; }
    const payload = {
      name: scn.name, scan_type: scn.scan_type, source_id: srcId,
      cron_expression: "0 0 * * *", cron_time_zone: "UTC", cron_enabled: false,
      connection_parameters: {}, access_scan_parameters: {}, sensitive_data_scan_parameters: {},
    };
    const r = await aa26CreateScan(cfg, payload);
    if (r.ok) { log(`  ✓ Created "${scn.name}" (${r.body.id})`); stats.scnCreated++; createdScanIds.push({id: r.body.id, name: scn.name, scan_type: scn.scan_type}); }
    else { log(`  ✗ Failed "${scn.name}": HTTP ${r.status} — ${JSON.stringify(r.body).slice(0,180)}`); stats.errors++; }
  }

  // ── Scan Executions (Hybrid approach)
  // Create one completed execution per scan to populate the Scan Executions page.
  // Limitations: API forces timestamps to "now" and object counts to 0 (server-side).
  // Status transitions: pending -> running -> completed (validated).
  log(`→ Phase 4/5: Scan Executions (${createdScanIds.length} simulated)`);
  stats.execCreated = 0;
  const newExecs = []; // Track newly created execution IDs for Phase 5
  for (const s of createdScanIds) {
    // Check if executions already exist for this scan
    const existingExecs = await aa26GetScanExecutions(cfg, s.id);
    if (existingExecs.length > 0) { log(`  ⊘ "${s.name}" already has ${existingExecs.length} execution(s)`); continue; }
    const r = await aa26SimulateExecution(cfg, s.id, s.scan_type);
    if (r.ok) { log(`  ✓ Execution for "${s.name}" (${r.execId})`); stats.execCreated++; newExecs.push({execId:r.execId, name:s.name, scan_type:s.scan_type}); }
    else { log(`  ✗ Execution for "${s.name}": ${r.error}`); stats.errors++; }
  }

  // ── Phase 5: Generate post-setup SQL command (source groups + timestamp fixup + multi-execution history)
  // The AA26 REST API cannot link sources to source groups, backdate timestamps, or insert multiple executions.
  // This generates a kubectl command the user runs on the AA26 server.
  const sourceNamesForGroups = plan.sources.map(s => s.name);
  if (newExecs.length > 0 || sourceNamesForGroups.length > 0) {
    const {cmd, summary} = aa26GeneratePostSetupSQL(sourceNamesForGroups, newExecs, cfg);
    stats.postSetupCmd = cmd;
    log(``);
    log(`→ Phase 5/5: Post-Setup SQL (copy to AA26 server)`);
    log(`  Generated kubectl command to:`);
    if (sourceNamesForGroups.length > 0) log(`    • Create ${sourceNamesForGroups.length} source groups + link sources`);
    if (newExecs.length > 0) {
      log(`    • Backdate ${summary.latestUpdated} latest scan executions (positions them as "today")`);
      log(`    • Insert ${summary.historicalAdded} historical execution clones spread over ${summary.historyDays} days`);
      log(`      (~${Math.round(summary.historicalAdded / summary.latestUpdated)} historical executions per scan @ ${summary.scanFreq}-day intervals)`);
    }
    log(`  Use the 📋 Copy button below to copy, then paste on the AA26 server.`);
  }

  log(``);
  log(`Done. Service Accounts: ${stats.saCreated} created, ${stats.saSkipped} skipped`);
  log(`      Sources:          ${stats.srcCreated} created, ${stats.srcSkipped} skipped`);
  log(`      Scans:            ${stats.scnCreated} created, ${stats.scnSkipped} skipped`);
  log(`      Executions:       ${stats.execCreated} created`);
  if (stats.errors > 0) log(`      ⚠ ${stats.errors} errors — review log above`);
  return stats;
}

async function injectAll(cfg, results, onProgress, cancelFlag) {
  const G = {};
  for (const [k,v] of Object.entries(results)) { if(!v.table)continue; if(!G[v.table])G[v.table]={c:v.cols,r:[]}; G[v.table].r=G[v.table].r.concat(v.rows); }
  let total = 0, errors = 0, tableErrors = 0;
  const MAX_TABLE_ERRORS = 2;  // skip table after 2 consecutive errors
  const MAX_TOTAL_ERRORS = 8;  // abort injection after 8 total errors
  const useMb = !!cfg.connection._mbSession;
  onProgress&&onProgress(`Using ${useMb ? 'Metabase API' : 'ClickHouse HTTP'} injection`);
  for (const [table, data] of Object.entries(G)) {
    if (cancelFlag&&cancelFlag.current) { onProgress&&onProgress("Cancelled."); break; }
    if (errors >= MAX_TOTAL_ERRORS) { onProgress&&onProgress(`Aborting — ${errors} total errors exceeded threshold (${MAX_TOTAL_ERRORS}). Fix the failing tables and retry.`); break; }
    tableErrors = 0;
    const batchSize = data.r.length > 5000 ? 1000 : 500;
    const batches = Math.ceil(data.r.length / batchSize);
    onProgress&&onProgress(`Injecting ${table} (${data.r.length} rows, ${batches} batches)...`);
    for (let i = 0; i < data.r.length; i += batchSize) {
      if (cancelFlag&&cancelFlag.current) { onProgress&&onProgress("  Stopped mid-table."); break; }
      if (tableErrors >= MAX_TABLE_ERRORS) { onProgress&&onProgress(`  Skipping remaining ${table} batches — ${tableErrors} consecutive errors (likely schema mismatch)`); break; }
      const batch = data.r.slice(i, i + batchSize);
      const sql = `INSERT INTO access_analyzer.${table} (${data.c}) VALUES\n${batch.join(",\n")}`;
      const batchNum = Math.floor(i/batchSize)+1;
      try {
        if (useMb) await mbInject(cfg, sql);
        else await chQuery(cfg, sql);
        total += batch.length;
        tableErrors = 0;
        if (batches > 3) onProgress&&onProgress(`  ${table}: batch ${batchNum}/${batches} — ${total} rows total`);
      } catch(e) {
        if ((e.message||"").indexOf('storage View')>=0) { onProgress&&onProgress(`  Skipping ${table} (computed view)`); break; }
        tableErrors++; errors++;
        onProgress&&onProgress(`  Error batch ${batchNum}: ${(e.message||"").slice(0,80)}`);
      }
    }
    onProgress&&onProgress(`  ${table}: done (${data.r.length} rows${tableErrors>0?", "+tableErrors+" errors":""})`);
  }
  return {total, errors};
}

// V2.6.3: Force ClickHouse dictionary reload — with privilege detection + fallback strategies
// SYSTEM RELOAD DICTIONARY requires admin privileges. The Metabase API user typically lacks these (Code 497).
// Fallback: query through the dict to trigger lazy lookup (works for some dict layouts).
const RELOAD_DICTS=['entities_hier_dict','domain_type_properties_dict','path_metadata_dict','permission_calc_rules_dict','permission_grant_rules_dict','source_settings_dict','source_type_registry_dict'];
async function reloadDictionaries(cfg, onProgress) {
  // First: diagnostic query — what's the current state of these dictionaries?
  onProgress&&onProgress(`Probing dictionary state...`);
  try {
    const probeSQL = `SELECT name, element_count, status, lifetime_min, lifetime_max FROM system.dictionaries WHERE database='access_analyzer' AND name IN ('${RELOAD_DICTS.join("','")}') FORMAT JSONEachRow`;
    let probeResult;
    if (cfg.connection._mbSession) {
      const resp = await fetch(cfg.connection.url+'/metabase/api/dataset', {
        method:'POST', headers:{'Content-Type':'application/json','X-Metabase-Session':cfg.connection._mbSession},
        body:JSON.stringify({database:cfg.connection.databaseId||2, type:'native', native:{query:probeSQL}})
      });
      probeResult = await resp.json();
      if (probeResult.data&&probeResult.data.rows) {
        const cols = probeResult.data.cols.map(c=>c.name);
        for (const row of probeResult.data.rows) {
          const r = Object.fromEntries(cols.map((c,i)=>[c,row[i]]));
          onProgress&&onProgress(`  ${r.name}: status=${r.status} elements=${r.element_count} lifetime=${r.lifetime_min}-${r.lifetime_max}s`);
        }
      }
    }
  } catch(e) {
    onProgress&&onProgress(`  Probe failed: ${(e.message||'').slice(0,120)}`);
  }

  // Strategy 1: SYSTEM RELOAD DICTIONARY (admin only)
  onProgress&&onProgress(`Strategy 1: SYSTEM RELOAD DICTIONARY...`);
  let ok=0, fail=0, privilegeError=false;
  for (const dict of RELOAD_DICTS) {
    try {
      const sql = `SYSTEM RELOAD DICTIONARY access_analyzer.${dict}`;
      if (cfg.connection._mbSession) await mbInject(cfg, sql);
      else await chQuery(cfg, sql);
      ok++;
      onProgress&&onProgress(`  ✓ Reloaded ${dict}`);
    } catch(e) {
      fail++;
      const msg = (e.message||'').slice(0,200);
      if (msg.indexOf('Code: 497')>=0 || msg.indexOf('Not enough privileges')>=0) privilegeError = true;
      onProgress&&onProgress(`  ✗ ${dict}: ${msg}`);
    }
  }

  // Strategy 2: If SYSTEM RELOAD blocked by privileges, try lazy-load via SELECT
  if (privilegeError) {
    onProgress&&onProgress(`⚠ Metabase user lacks SYSTEM privileges (Code 497). Falling back to lazy-load via SELECT queries...`);
    let lazyOk=0, lazyFail=0;
    for (const dict of RELOAD_DICTS) {
      try {
        // Querying through the dict can trigger lazy population for cache/direct layouts
        const sql = `SELECT count() FROM access_analyzer.${dict}`;
        if (cfg.connection._mbSession) {
          const resp = await fetch(cfg.connection.url+'/metabase/api/dataset', {
            method:'POST', headers:{'Content-Type':'application/json','X-Metabase-Session':cfg.connection._mbSession},
            body:JSON.stringify({database:cfg.connection.databaseId||2, type:'native', native:{query:sql}})
          });
          const j = await resp.json();
          const count = j.data&&j.data.rows&&j.data.rows[0]?j.data.rows[0][0]:'?';
          if (count>0) { lazyOk++; onProgress&&onProgress(`  ✓ ${dict}: ${count} elements after lazy load`); }
          else { lazyFail++; onProgress&&onProgress(`  ✗ ${dict}: 0 elements (lazy load did not populate)`); }
        }
      } catch(e) {
        lazyFail++;
        onProgress&&onProgress(`  ✗ ${dict}: ${(e.message||'').slice(0,120)}`);
      }
    }
    onProgress&&onProgress(`Lazy-load result: ${lazyOk} populated, ${lazyFail} still empty`);

    if (lazyFail>0) {
      onProgress&&onProgress('━━━ ACTION REQUIRED ━━━');
      onProgress&&onProgress('Some dictionaries remain empty. To populate them, run these commands as a ClickHouse admin user');
      onProgress&&onProgress('(not the Metabase API user). Either via clickhouse-client, the admin UI, or a server shell:');
      onProgress&&onProgress('');
      for (const dict of RELOAD_DICTS) {
        onProgress&&onProgress(`  SYSTEM RELOAD DICTIONARY access_analyzer.${dict};`);
      }
      onProgress&&onProgress('');
      onProgress&&onProgress('After running those, Access reports + Content reports + Nested Shares should populate.');
      onProgress&&onProgress('━━━━━━━━━━━━━━━━━━━━━━');
    }
  }

  // Strategy 3: OPTIMIZE MVs (also requires privileges, but worth trying)
  const OPTIMIZE_MVS=['mv_effective_permissions','mv_assigned_permissions','mv_principal','mv_group_membership','mv_actors'];
  for (const mv of OPTIMIZE_MVS) {
    try {
      const sql = `OPTIMIZE TABLE access_analyzer.${mv} FINAL`;
      if (cfg.connection._mbSession) await mbInject(cfg, sql);
      else await chQuery(cfg, sql);
    } catch(e) { /* non-fatal */ }
  }
  return {ok, fail, privilegeError};
}

// V2.6.4: MV Backfill — re-INSERT v2 base tables to fire MV triggers with current dict state.
// Only useful AFTER dictionaries are reloaded (which requires admin SYSTEM privileges via kubectl).
// All these INSERTs work via the Metabase API user — no admin needed.
// Re-inserted ReplacingMergeTree rows dedupe at merge time, so row counts stay sane.
async function runMvBackfill(cfg, onProgress) {
  onProgress&&onProgress("━━━ MV Backfill (re-fires triggers with current dict state) ━━━");
  const BACKFILL_TABLES=['entities','principals','permissions','memberships'];
  let ok=0, fail=0;
  for (const t of BACKFILL_TABLES) {
    try {
      const sql = `INSERT INTO access_analyzer.${t} SELECT * FROM access_analyzer.${t}`;
      if (cfg.connection._mbSession) await mbInject(cfg, sql);
      else await chQuery(cfg, sql);
      ok++;
      onProgress&&onProgress(`  ✓ Re-inserted ${t} (MV trigger fired)`);
    } catch(e) {
      fail++;
      onProgress&&onProgress(`  ✗ ${t}: ${(e.message||'').slice(0,150)}`);
    }
  }
  // V2.6.7: REFRESHABLE MVs (mv_effective_permissions = REFRESH EVERY 1 MINUTE,
  // mv_principal = REFRESH EVERY 5 MINUTE) — these don't fire on INSERT triggers.
  // Force an immediate refresh so we don't have to wait the schedule.
  // V2.6.14: Added mv_group_membership + mv_actors to catch all zero-row MVs
  const REFRESHABLE_MVS=['mv_effective_permissions','mv_assigned_permissions','mv_principal','mv_group_membership','mv_actors'];
  onProgress&&onProgress("Triggering SYSTEM REFRESH on refreshable MVs...");
  for (const mvName of REFRESHABLE_MVS) {
    try {
      const sql = `SYSTEM REFRESH VIEW access_analyzer.${mvName}`;
      if (cfg.connection._mbSession) {
        const resp = await fetch(cfg.connection.url+'/metabase/api/dataset',{
          method:'POST', headers:{'Content-Type':'application/json','X-Metabase-Session':cfg.connection._mbSession},
          body:JSON.stringify({database:cfg.connection.databaseId||2, type:'native', native:{query:sql}})
        });
        const j = await resp.json();
        if (j && j.error) {
          // "did not produce a ResultSet" means the DDL command executed — it's success, not an error
          if (String(j.error).includes('ResultSet') || String(j.error).includes('did not produce')) {
            onProgress&&onProgress(`  ✓ Triggered refresh: ${mvName} (DDL executed)`);
          } else {
            onProgress&&onProgress(`  ⚠ ${mvName}: ${String(j.error).slice(0,150)}`);
            if (String(j.error).includes('497')||String(j.error).includes('ACCESS_DENIED')) {
              onProgress&&onProgress(`     Need GRANT: curl -u $CHUSER:$CHPASS -X POST "http://$CHIP:8123/" --data "GRANT SYSTEM REFRESH VIEW ON *.* TO access_analyzer_metabase"`);
            }
          }
        } else {
          onProgress&&onProgress(`  ✓ Triggered refresh: ${mvName}`);
        }
      }
    } catch(e) {
      onProgress&&onProgress(`  ⚠ ${mvName}: ${(e.message||'').slice(0,100)}`);
    }
  }
  // Brief wait for refresh to actually populate
  // V2.6.14: Increased wait from 8s to 20s — refreshable MVs like mv_principal (REFRESH EVERY 5 MIN) need more time
  onProgress&&onProgress("Waiting 20s for refresh to complete...");
  await new Promise(r=>setTimeout(r,20000));

  // V2.6.14: Second backfill pass — trigger-based MVs (mv_actors) may not have fired
  // on the first pass if dicts weren't ready yet. Re-insert principals to catch them.
  onProgress&&onProgress("Second pass: re-firing triggers for any remaining zero MVs...");
  for (const t of ['principals','memberships']) {
    try {
      const sql = `INSERT INTO access_analyzer.${t} SELECT * FROM access_analyzer.${t}`;
      if (cfg.connection._mbSession) await mbInject(cfg, sql);
      else await chQuery(cfg, sql);
      onProgress&&onProgress(`  ✓ Re-inserted ${t} (second pass)`);
    } catch(e) { /* non-fatal */ }
  }
  await new Promise(r=>setTimeout(r,5000));

  // Verify MV population
  onProgress&&onProgress("Verifying MV row counts...");
  try {
    const sql = `SELECT name, total_rows FROM system.tables WHERE database='access_analyzer' AND name IN ('mv_effective_permissions','mv_assigned_permissions','mv_principal','mv_actors','mv_objects','mv_current_objects','mv_group_membership') ORDER BY name`;
    if (cfg.connection._mbSession) {
      const resp = await fetch(cfg.connection.url+'/metabase/api/dataset',{
        method:'POST', headers:{'Content-Type':'application/json','X-Metabase-Session':cfg.connection._mbSession},
        body:JSON.stringify({database:cfg.connection.databaseId||2, type:'native', native:{query:sql}})
      });
      const j = await resp.json();
      if (j&&j.data&&j.data.rows&&j.data.rows.length>0) {
        const cols = j.data.cols.map(c=>c.name);
        const nameIdx = cols.indexOf('name');
        const rowsIdx = cols.indexOf('total_rows');
        for (const row of j.data.rows) {
          const name = row[nameIdx];
          const totalRows = parseInt(row[rowsIdx])||0;
          const status = totalRows > 0 ? '✓' : '⚠';
          onProgress&&onProgress(`  ${status} ${name}: ${totalRows} rows`);
          // V2.6.15: Explain mv_principal = 0 — it's a known limitation, auto-populates within 5 min
          if (name === 'mv_principal' && totalRows === 0) {
            onProgress&&onProgress(`     ℹ Attempting manual population of mv_principal...`);
            try {
              // Discover the MV's SELECT query
              const defResp = await fetch(cfg.connection.url+'/metabase/api/dataset',{
                method:'POST', headers:{'Content-Type':'application/json','X-Metabase-Session':cfg.connection._mbSession},
                body:JSON.stringify({database:cfg.connection.databaseId||2, type:'native', native:{query:"SHOW CREATE TABLE access_analyzer.mv_principal"}})
              });
              const defJ = await defResp.json();
              if (defJ&&defJ.data&&defJ.data.rows&&defJ.data.rows[0]) {
                const createStmt = defJ.data.rows[0][0];
                // Extract the AS SELECT ... portion
                const asMatch = createStmt.match(/AS\s+(SELECT[\s\S]+)$/i);
                if (asMatch) {
                  const selectQuery = asMatch[1].trim();
                  onProgress&&onProgress(`     ℹ Found mv_principal query — inserting directly...`);
                  await mbInject(cfg, `INSERT INTO access_analyzer.mv_principal ${selectQuery}`);
                  // Verify
                  const vResp = await fetch(cfg.connection.url+'/metabase/api/dataset',{
                    method:'POST', headers:{'Content-Type':'application/json','X-Metabase-Session':cfg.connection._mbSession},
                    body:JSON.stringify({database:cfg.connection.databaseId||2, type:'native', native:{query:"SELECT count() FROM access_analyzer.mv_principal"}})
                  });
                  const vJ = await vResp.json();
                  const newCount = (vJ&&vJ.data&&vJ.data.rows&&vJ.data.rows[0]) ? parseInt(vJ.data.rows[0][0])||0 : 0;
                  if (newCount > 0) {
                    onProgress&&onProgress(`     ✓ mv_principal manually populated: ${newCount} rows`);
                  } else {
                    onProgress&&onProgress(`     ℹ mv_principal still 0 — will auto-populate within 5 min. No action needed.`);
                  }
                }
              }
            } catch(e) {
              onProgress&&onProgress(`     ℹ mv_principal will auto-populate within 5 min. No action needed.`);
            }
          }
        }
      } else {
        onProgress&&onProgress(`  ⚠ MV verify query returned no rows (response: ${JSON.stringify(j).slice(0,200)})`);
      }
    }
  } catch(e) {
    onProgress&&onProgress(`  Verify failed: ${(e.message||'').slice(0,200)}`);
  }
  onProgress&&onProgress(`MV Backfill: ${ok} ok, ${fail} failed`);
  return {ok, fail};
}

// V2.6.4: Output kubectl one-liner for SYSTEM RELOAD (Metabase API can't run these — admin only)
function outputKubectlRecoveryCommands(onProgress) {
  onProgress&&onProgress("━━━ KUBECTL RECOVERY COMMANDS ━━━");
  onProgress&&onProgress("Metabase API user cannot run SYSTEM RELOAD (Code 497).");
  onProgress&&onProgress("To populate dictionaries, run THIS one-liner on the AA26 host:");
  onProgress&&onProgress("");
  onProgress&&onProgress(`kubectl exec -n access-analyzer clickhouse-0 -- clickhouse-client --multiquery --query "SYSTEM RELOAD DICTIONARY access_analyzer.entities_hier_dict; SYSTEM RELOAD DICTIONARY access_analyzer.domain_type_properties_dict; SYSTEM RELOAD DICTIONARY access_analyzer.path_metadata_dict; SYSTEM RELOAD DICTIONARY access_analyzer.permission_calc_rules_dict; SYSTEM RELOAD DICTIONARY access_analyzer.permission_grant_rules_dict; SYSTEM RELOAD DICTIONARY access_analyzer.source_settings_dict; SYSTEM RELOAD DICTIONARY access_analyzer.source_type_registry_dict;"`);
  onProgress&&onProgress("");
  onProgress&&onProgress("After running it, click the 🔄 'Recovery' button below to re-fire MV triggers.");
  onProgress&&onProgress("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━");
}

// BUG 5 FIX: Refresh Metabase model cards after injection to bust stale cache
const MODEL_CARD_IDS=[123,124,120,215,223,225,252,284,331,148,151,154,156,164];
async function mbRefreshModelCards(cfg, onProgress) {
  const sid = cfg.connection._mbSession;
  if (!sid) { onProgress&&onProgress("Skipping model card refresh — no Metabase session"); return; }
  onProgress&&onProgress(`Refreshing ${MODEL_CARD_IDS.length} Metabase model cards (bust cache)...`);
  let ok=0, fail=0;
  for (const cardId of MODEL_CARD_IDS) {
    try {
      const resp = await fetch(cfg.connection.url + `/metabase/api/card/${cardId}/query`, {
        method:'POST', headers:{'Content-Type':'application/json','X-Metabase-Session':sid},
        body:JSON.stringify({ignore_cache:true})
      });
      if (resp.ok || resp.status===202) { ok++; }
      else { fail++; onProgress&&onProgress(`  Card ${cardId}: HTTP ${resp.status}`); }
    } catch(e) { fail++; onProgress&&onProgress(`  Card ${cardId}: ${(e.message||'').slice(0,50)}`); }
  }
  onProgress&&onProgress(`  Model cards refreshed: ${ok} ok, ${fail} failed`);
  return {ok, fail};
}

function Badge({children,variant="accent",t}){
  const m={accent:`${t.accentBg} ${t.accent} ${t.accentBorder}`,success:`${t.successBg} ${t.success}`,warn:`${t.warnBg} ${t.warn}`,danger:`${t.dangerBg} ${t.danger}`};

function Toast({toasts,onDismiss,t}){
  if(!toasts||toasts.length===0)return null;
  return <div className="fixed bottom-4 right-4 z-50 space-y-2 max-w-sm">
    {toasts.map(toast=><div key={toast.id} className={cn("toast-enter rounded-lg p-3 shadow-lg border flex items-start gap-2",t.bgCard,t.border,t.text)}>
      <span className="text-base">{toast.variant==="success"?"✓":toast.variant==="error"?"✗":toast.variant==="warn"?"⚠":"ℹ"}</span>
      <span className="text-xs flex-1">{toast.message}</span>
      <button onClick={()=>onDismiss(toast.id)} className={cn("text-xs",t.textFaint)}>×</button>
    </div>)}
  </div>;
}

function Modal({open,onClose,title,children,t,danger}){

      </div>
      <div className={cn("text-sm",t.text)}>{children}</div>

function PhaseProgress({phases,current,t}){
  return <div className="space-y-2">
    <div className="flex items-center gap-1">
      {phases.map((p,i)=>{
        const done=i<current;const active=i===current;
        return <div key={i} className="flex-1">
          <div className={cn("h-1.5 rounded-full transition-all duration-500",done?"bg-emerald-500":active?"bg-violet-500":t.bgInput)} style={active?{animation:"pulse 1.5s ease-in-out infinite"}:{}}></div>
        </div>;
      })}
    </div>
    <div className="grid grid-cols-5 gap-1">
      {phases.map((p,i)=>{
        const done=i<current;const active=i===current;
        return <div key={i} className={cn("text-[10px] text-center",done?"text-emerald-400":active?"text-violet-400 font-semibold":t.textFaint)}>{done?"✓ ":active?"⏳ ":""}{p}</div>;
      })}
    </div>
  </div>;
}
