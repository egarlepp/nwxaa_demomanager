// Helpers — all return safe defaults if locale missing (back-compat for old configs)
// v3.2.5: getLocale is the single choke point every generator call goes through for
// names/offices/phone format — layering overrides in here means the "Edit Region Data" drawer
// affects real generation without needing to touch every call site individually.
const getLocale = (cfg) => {
  const base = LOCALES[cfg?.global?.locale] || LOCALES.us;
  const ov = cfg?.localeOverrides?.[cfg?.global?.locale];
  if (!ov) return base;
  return {
    ...base,
    firstNames: ov.firstNames?.length ? ov.firstNames : base.firstNames,
    lastNames: ov.lastNames?.length ? ov.lastNames : base.lastNames,
    offices: ov.offices?.length ? ov.offices : base.offices,
  };
};

// v3.1.0: normalize a name part for sam/UPN/email construction.
// Handles common European special chars that NFD-strip alone doesn't cover (ß, æ, ø, œ).
// "Müller" → "mueller" | "São" → "sao" | "Léa" → "lea" | "Weiß" → "weiss" | "D'Angelo" → "dangelo"
function normalizeNamePart(s) {
  return (s||'')
    .replace(/ß/g, 'ss')
    .replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue')
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue')
    .replace(/æ/g,'ae').replace(/Æ/g,'AE')
    .replace(/ø/g,'o').replace(/Ø/g,'O')
    .replace(/œ/g,'oe').replace(/Œ/g,'OE')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]/g, '');
}

// v3.1.0-beta3: derive AD-style domain name + FQDN base from a regional company name.
// "CLÍNICA BRASIL S.A." → { adName: 'CLINICABRASIL', fqdnBase: 'clinica-brasil' }
function deriveDomainFromCompany(companyName) {
  let clean = (companyName||'').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  // Strip legal suffixes — order matters: longer/more-specific first
  clean = clean.replace(/\s+(S\.p\.A\.|S\.r\.l\.|S\.A\.S\.|S\.A\.C\.|S\.R\.L\.|S\.A\. de C\.V\.|S\.A\.|S\.L\.|Sp\. z o\.o\.|s\.r\.o\.|EIRELI|GmbH|SARL|Ltda|Corp|Plc|Inc|LLC|SAS|OOO|Ltd|KG|AG|SA)\s*$/i, '').trim();
  // Collapse internal whitespace
  clean = clean.replace(/\s+/g, ' ');

  let adName = clean.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (adName.length > 16) adName = adName.substring(0, 16);

  let fqdnBase = clean.toLowerCase().split(/\s+/).join('-').replace(/[^a-z0-9-]/g, '');
  if (fqdnBase.length > 24) {
    // Fall back to first 2 words if full name is too long for a clean domain
    fqdnBase = clean.toLowerCase().split(/\s+/).slice(0, 2).join('-').replace(/[^a-z0-9-]/g, '');
  }

  return { adName, fqdnBase };
}

// v3.1.0-beta: cascade locale change → updates domain, taxonomies, SPO URLs, FS hostnames.
// v3.1.0-beta5: delegates to applyVerticalTemplate after setting locale, so SPO/FS refresh too.
function applyLocaleChange(cfg, newLocaleKey) {
  const newLoc = LOCALES[newLocaleKey] || LOCALES.us;
  const oldLoc = LOCALES[cfg?.global?.locale] || LOCALES.us;

  // Step 1: set new locale, then let applyVerticalTemplate recompute domain/SPO/FS based on it
  let updated = { ...cfg, global: { ...cfg.global, locale: newLocaleKey } };
  updated = applyVerticalTemplate(updated, updated.global.vertical || 'generic');

  // v3.2.0: locale no longer injects fictional regional-regulation "taxonomies" — none of the
  // old extraRegulations names (LGPD, BDSG, RODO, etc.) correspond to a real AA26 Sensitive Data
  // Pattern group, so keeping that cascade would just reintroduce the fictional/real mismatch
  // this rework removes. Vertical selection alone now drives sd.enabledGroups.
  return updated;
}


// V2.6.8: Apply a vertical template to a cfg — returns new cfg with merged values.
// Non-destructive for global counts (userCount, groupCount, etc.) — only replaces names/structure.
const applyVerticalTemplate = (cfg, verticalKey) => {
  const tpl = VERTICAL_TEMPLATES[verticalKey];
  const locale = LOCALES[cfg?.global?.locale] || LOCALES.us;
  const isUsBaseline = (cfg.global?.locale || 'us') === 'us';

  // v3.1.0-beta3: derive domain name+fqdn from regional company name when non-US
  // For 'generic' vertical: still need to apply regional domain even without a template
  if (!tpl || verticalKey === 'generic') {
    let genDomainName, genDomainFqdn;
    if (isUsBaseline) {
      genDomainName = 'ACME';
      genDomainFqdn = 'acme.local';
    } else {
      const company = COMPANY_NAMES.generic?.[cfg.global.locale];
      const derived = deriveDomainFromCompany(company);
      genDomainName = derived.adName;
      genDomainFqdn = `${derived.fqdnBase}.${locale.emailTlds[0]}`;
    }
    // Refresh FS hostnames + SPO tenant URLs to current regional domain
    const genSpoTenant = genDomainName.toLowerCase().replace(/[^a-z0-9]/g, '');
    const genFs = cfg.fs?.hosts?.length ? {...cfg.fs, hosts: cfg.fs.hosts.map(h => ({
      ...h, hostname: `${(h.hostname||'fs01').split('.')[0]}.${genDomainFqdn}`,
    }))} : cfg.fs;
    const genSpo = cfg.spo?.tenants?.length ? {...cfg.spo, tenants: cfg.spo.tenants.map(tnt => {
      const isMy = (tnt.url||'').includes('-my.sharepoint.com');
      const newTenantUrl = `https://${genSpoTenant}${isMy?'-my':''}.sharepoint.com`;
      return {...tnt, url: newTenantUrl, sites: (tnt.sites||[]).map(s => ({...s,
        url: (s.url||'').replace(/^https:\/\/[^/]+/, newTenantUrl),
      }))};
    })} : cfg.spo;
    return {...cfg, global:{...cfg.global, vertical:verticalKey, domainName:genDomainName, domainFqdn:genDomainFqdn}, fs:genFs, spo:genSpo};
  }

  // 1) Global: domain + tenant
  // For US: use vertical's hardcoded themed TLD (.health/.edu/.gov/.bank — preserves brand identity)
  // For non-US: derive both name and FQDN from regional company name in COMPANY_NAMES matrix
  let newDomainName, newDomainFqdn;
  if (isUsBaseline) {
    newDomainName = tpl.domain?.name || cfg.global.domainName;
    newDomainFqdn = tpl.domain?.fqdn || cfg.global.domainFqdn;
  } else {
    const company = COMPANY_NAMES[verticalKey]?.[cfg.global.locale] || COMPANY_NAMES.generic[cfg.global.locale];
    const derived = deriveDomainFromCompany(company);
    newDomainName = derived.adName;
    newDomainFqdn = `${derived.fqdnBase}.${locale.emailTlds[0]}`;
  }

  const newGlobal = {
    ...cfg.global,
    vertical: verticalKey,
    domainName: newDomainName,
    domainFqdn: newDomainFqdn,
    sidBase: tpl.domain?.sidBase || cfg.global.sidBase,
  };

  // 2) AD departments
  const newAd = {...cfg.ad, departments: tpl.departments || cfg.ad.departments};

  // 3) FS hosts/shares — hostnames become FQDNs using current (regional) domain
  // v3.1.0-beta5: fs01 → fs01.meridianhealth.health (US) or fs01.clinica-brasil.com.br (LATAM-PT)
  let newFs = cfg.fs;
  if (tpl.fsShares) {
    newFs = {...cfg.fs, hosts: tpl.fsShares.map(h => ({
      hostname: `${h.host}.${newDomainFqdn}`,
      os: h.os,
      shares: h.shares.map(s => ({...s})),
    }))};
  } else if (cfg.fs?.hosts?.length) {
    // No template fsShares (e.g. generic vertical) — refresh existing hosts' FQDNs to current domain
    newFs = {...cfg.fs, hosts: cfg.fs.hosts.map(h => ({
      ...h,
      hostname: `${(h.hostname||'fs01').split('.')[0]}.${newDomainFqdn}`,
    }))};
  }

  // 4) SPO tenants/sites — tenant prefix derives from regional company (US uses tpl.spoTenant; non-US derives from domainName)
  // v3.1.0-beta5: meridianhealth.sharepoint.com (US) → clinicabrasil.sharepoint.com (LATAM-PT)
  const spoTenant = isUsBaseline
    ? (tpl.spoTenant || newDomainName.toLowerCase().replace(/[^a-z0-9]/g, ''))
    : newDomainName.toLowerCase().replace(/[^a-z0-9]/g, '');
  let newSpo = cfg.spo;
  if (tpl.spoSites && spoTenant) {
    const mainUrl = `https://${spoTenant}.sharepoint.com`;
    const myUrl = `https://${spoTenant}-my.sharepoint.com`;
    const sites = tpl.spoSites.map(s => ({
      name: s.name,
      url: `${mainUrl}/sites/${s.pathSuffix}`,
      type: s.type,
      docs: s.docs,
      sensitiveRate: s.sensitiveRate,
      libraries: s.libraries,
    }));
    const odSites = (tpl.onedriveUsers || []).map(uname => ({
      name: `OneDrive - ${uname.replace(/_/g,' ')}`,
      url: `${myUrl}/personal/${uname.toLowerCase()}_${spoTenant}_${newDomainFqdn.replace(/\./g,'_')}`,
      type: 'onedrive',
      docs: 40 + Math.floor(Math.random()*30),
      sensitiveRate: 30 + Math.floor(Math.random()*30),
      libraries: ['Documents'],
    }));
    newSpo = {...cfg.spo, tenants: [
      {url: mainUrl, sites: sites},
      {url: myUrl, sites: odSites},
    ]};
  } else if (cfg.spo?.tenants?.length && spoTenant) {
    // No template spoSites (e.g. generic vertical) — rewrite existing tenant URLs to current SPO prefix
    const mainUrl = `https://${spoTenant}.sharepoint.com`;
    const myUrl = `https://${spoTenant}-my.sharepoint.com`;
    newSpo = {...cfg.spo, tenants: cfg.spo.tenants.map(tnt => {
      const isMy = (tnt.url||'').includes('-my.sharepoint.com');
      const newTenantUrl = isMy ? myUrl : mainUrl;
      return {
        ...tnt,
        url: newTenantUrl,
        sites: (tnt.sites||[]).map(s => ({
          ...s,
          url: (s.url||'').replace(/^https:\/\/[^/]+/, newTenantUrl),
        })),
      };
    })};
  }

  // 5) Sensitive data — vertical selection directly replaces which real AA26 Sensitive Data
  // Pattern groups are emphasized (v3.2.0: no more fictional regional-regulation merging —
  // see applyLocaleChange for why that was removed).
  let newSd = cfg.sd;
  if (tpl.taxonomies) {
    newSd = {...cfg.sd, enabledGroups: tpl.taxonomies};
  }

  return {...cfg, global:newGlobal, ad:newAd, fs:newFs, spo:newSpo, sd:newSd};
};

// v3.0 — Activity timestamp generator that respects business-hour patterns
// Returns a Date for the event, or null if the event should be skipped (e.g., weekend with weekendActivity off)
function pickActivityTime(baseNow, daysAgo, pattern){
  // If pattern is disabled, use the original uniform-random behavior
  if(!pattern||!pattern.enabled){
    return new Date(baseNow - daysAgo*864e5 - Math.floor(Math.random()*86400)*1000);
  }
  const date = new Date(baseNow - daysAgo*864e5);
  const dow = date.getDay(); // 0=Sun, 6=Sat
  const isWeekend = (dow===0||dow===6);
  // Filter weekends
  if(isWeekend && !pattern.weekendActivity) return null;
  // Pick an hour based on pattern settings
  let hour;
  const workStart = pattern.workStart||9;
  const workEnd = pattern.workEnd||17;
  if(isWeekend){
    // Weekend activity (admin/oncall): broad spread but lower-density during sleep hours
    if(Math.random()<0.4) hour = Math.floor(Math.random()*24);
    else hour = workStart + Math.floor(Math.random()*Math.max(1,workEnd-workStart));
  } else if(pattern.nightActivity && Math.random()<0.15){
    // 15% of events on night/evening hours (off-hours admin, service accounts, late workers)
    hour = Math.random()<0.5 ? Math.floor(Math.random()*workStart) : workEnd + Math.floor(Math.random()*(24-workEnd));
  } else {
    // Business hours — weight peaks around mid-morning and mid-afternoon
    const r = Math.random();
    if(r<0.25) hour = workStart + Math.floor(Math.random()*2); // early
    else if(r<0.55) hour = workStart + 1 + Math.floor(Math.random()*3); // mid-morning peak
    else if(r<0.85) hour = workEnd - 4 + Math.floor(Math.random()*3); // afternoon peak
    else hour = workEnd - 1 - Math.floor(Math.random()*2); // late
    hour = Math.max(workStart, Math.min(workEnd-1, hour));
  }

  if(pattern.lunchDip && hour===12 && Math.random()<0.5){
    hour = Math.random()<0.5 ? 11 : 13;
  }
  const minute = Math.floor(Math.random()*60);
  const second = Math.floor(Math.random()*60);
  date.setHours(hour, minute, second, 0);

}
// Activity date generator: ~40% within last 7 days, rest spread over maxDays
// v3.2.0: pick a real Sensitive Data Pattern match — uses the live-discovered catalog
// (cfg._sdCatalog, populated by Detect Session) when available, otherwise falls back to
// matching on the group name alone (no individual pattern name known pre-connect).
function pickSdMatch(cfg){
  const groups=(cfg.sd?.enabledGroups||[]).length?cfg.sd.enabledGroups:['PII'];
  const groupName=pick(groups);
  const catalog=cfg._sdCatalog;
  const candidates=(catalog&&catalog.byGroup&&catalog.byGroup[groupName]&&catalog.byGroup[groupName].length)
    ? catalog.byGroup[groupName] : [{name:groupName,confidence:'medium'}];
  const p=pick(candidates);
  return {groupName, patternName:p.name, confidence:p.confidence||'medium'};
}
const activityDate=(now,maxDays=180)=>{
  // V2.6.6: 60% in last 7 days, 20% in 7-30 days, 20% in 30-maxDays.
  // Aggressively recent so reports with default "Previous 7 days" filters populate immediately.
  const r=Math.random();
  let daysAgo;
  if(r<0.6) daysAgo=Math.floor(Math.random()*7);
  else if(r<0.8) daysAgo=7+Math.floor(Math.random()*23);
  else daysAgo=30+Math.floor(Math.random()*(maxDays-30));
  return new Date(now-daysAgo*864e5);
};

    // v3.1.4: AD Activity Monitor generation (netwrix_activity_monitor_ad) — NEW table, confirmed

      onProgress&&onProgress("  Generating AD activity events...");

      const adCols=adSchema.map(c=>c.name);
      const adRows=[];
      const adEsc=v=>String(v).replace(/'/g,"''");
      const aq=v=>`'${adEsc(String(v??''))}'`;
      // JSON-typed columns need an explicit valid literal — chDefault's generic '' fallback
      // isn't valid JSON and would fail the INSERT (same reason Copilot overrides `plugins` below).
      const AD_JSON_COLS=new Set(['new_attributes','old_attributes','pac','pac_extra_sids','desired_access']);
      const mkAd=(fields)=>{
        const vals=adCols.map(col=>{
          if(fields[col]!==undefined)return fields[col];
          if(AD_JSON_COLS.has(col))return `'{}'`;
          return chDefault((adSchema.find(c=>c.name===col)||{}).type||'');
        });
        return `(${vals.join(',')})`;
      };
      const AD_ACTIVITY_TYPES=['Logon','Logoff','KerberosTGTRequest','KerberosTGSRequest','ObjectModified','ObjectCreated','PasswordChange','AccountLockout','GroupMembershipChange','LDAPQuery'];
      const LOGON_TYPES=['Interactive','Network','Service','Batch','RemoteInteractive','NetworkCleartext'];
      const ENC_TYPES=['AES256-CTS-HMAC-SHA1-96','AES128-CTS-HMAC-SHA1-96','RC4-HMAC'];
      const dcHost=`dc01.${cfg.global.domainFqdn}`;
      const dcIp=`10.${20+Math.floor(Math.random()*40)}.${Math.floor(Math.random()*256)}.${1+Math.floor(Math.random()*5)}`;

      for(let i=0;i<targetAdEvents;i++){
        if(!users.length)break;
        const u=pick(users);
        const evType=pick(AD_ACTIVITY_TYPES);
        const r=Math.random();
        const daysAgo=r<0.6?Math.floor(Math.random()*7):r<0.8?7+Math.floor(Math.random()*23):30+Math.floor(Math.random()*60);
        const evTime=pickActivityTime(now,daysAgo,cfg.global.activityPattern);

        const evTs=evTime.toISOString().replace('T',' ').slice(0,23);
        const isBadEvent=(evType==='AccountLockout')||Math.random()<0.06;
        const success=!isBadEvent;
        const clientIp=`10.${50+Math.floor(Math.random()*100)}.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}`;
        const clientHost=`WKS-${1000+Math.floor(Math.random()*899)}.${cfg.global.domainFqdn}`;
        const isKerb=evType==='KerberosTGTRequest'||evType==='KerberosTGSRequest';
        const isQuery=evType==='LDAPQuery';
        const fields={
          activity_type:aq(evType),source:aq('Active Directory'),
          event_type:aq(evType.replace(/([A-Z])/g,' $1').trim()),
          time_logged:aq(evTs),agent_host:aq(dcHost),agent_ip:aq(dcIp),agent_domain:aq(cfg.global.domainFqdn),
          user_name:aq(`${u.f} ${u.l}`),user_sid:aq(u.s),user_dn:aq(u.dn),user_guid:aq(uuid()),

          class_name:aq('user'),protocol:aq(isKerb?'Kerberos':pick(['Kerberos','NTLM','LDAP'])),

          logon_type:aq(pick(LOGON_TYPES)),
          target_host:aq(evType.startsWith('Kerberos')?dcHost:clientHost),
          target_host_ip:aq(evType.startsWith('Kerberos')?dcIp:clientIp),
          encryption_type:aq(pick(ENC_TYPES)),
          is_user_exist:(success||evType==='AccountLockout')?'true':(Math.random()<0.8?'true':'false'),
        };
        if(isKerb){
          fields.kerb_spn=aq(`HOST/${dcHost}`);
          fields.tgs_reply_encryption_type=aq(pick(ENC_TYPES));
          fields.kerb_auth_time=aq(evTs);fields.kerb_start_time=aq(evTs);
          fields.kerb_end_time=aq(new Date(evTime.getTime()+10*3600*1000).toISOString().replace('T',' ').slice(0,23));

          fields.query_runtime_max=String(10+Math.floor(Math.random()*40));

      R.activity_ad={table:'netwrix_activity_monitor_ad',cols:adCols.join(','),rows:adRows};
      onProgress&&onProgress(`AD Activity: ${adRows.length} events generated`);

    // v3.1.4: Entra ID Activity Monitor generation (netwrix_activity_monitor_entra) — NEW table,
    // confirmed live against AA26 v1.1.5. Reuses the same AD users so identities line up across

        const evTime=pickActivityTime(now,daysAgo,cfg.global.activityPattern);
        if(!evTime)continue;
        const evTs=evTime.toISOString().replace('T',' ').slice(0,23);
        const isRisky=Math.random()<0.08;
        const success=!isRisky&&Math.random()>0.04;
        const riskLevel=isRisky?pick(['low','medium','high']):'none';
        const upn=`${u.sam}@${pickEmailDomain(cfg)}`;
        const clientIp=`${20+Math.floor(Math.random()*180)}.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}`;

        enRows.push(mkEn({

          user_name:eq(`${u.f} ${u.l}`),user_sid:eq(u.s),success:success?'true':'false',
          id:eq(uuid()),tenant_id:eq(cfg.global.tenantId),tenant_display_name:eq(cfg.global.domainName),
          correlation_id:eq(uuid()),
          initiated_by_user_upn:eq(upn),initiated_by_user_id:eq(uuid()),initiated_by_user_ip:eq(clientIp),
          initiated_by_user_display_name:eq(`${u.f} ${u.l}`),
          initiated_by_app_display_name:eq(app),initiated_by_app_id:eq(uuid()),

          result_reason:eq(success?'':pick(['Invalid username or password','Account is locked','MFA required','Blocked by conditional access'])),
          activity_display_name:eq(evType==='SignIn'?'Sign-in activity':evType.replace(/([A-Z])/g,' $1').trim()),
          operation_type:eq(evType==='SignIn'?'Sign-in':'Update'),
          logged_by_service:eq('Core Directory'),
          status_error_code:success?'0':String(pick([50126,50053,53003,50076])),
          status_failure_reason:eq(success?'':'See result_reason'),

          device_id:eq(uuid()),device_display_name:eq(`${u.sam}-PC`),
          device_os:eq(pick(EN_DEVICE_OS)),device_browser:eq(pick(EN_BROWSERS)),
          device_is_compliant:Math.random()<0.7?'true':'false',device_is_managed:Math.random()<0.8?'true':'false',
          device_trust_type:eq(pick(['AzureAD','Hybrid Azure AD joined','Not Registered'])),

    // Shared Links generation (schema-discovery-driven — for "Shared Links" and "Shared Links Activity" reports)

      const LINK_SCOPES=['ANONYMOUS','ORGANIZATION','USERS'];
      const LINK_TYPES=['VIEW','EDIT','REVIEW'];
      for(const tenant of (cfg.spo.tenants||[])){
      for(const site of tenant.sites){
        const siteHost=new URL(site.url).hostname;
        const nLinks=Math.max(2,Math.floor(site.docs*((cfg.spo.externalSharing||5)/100)));
        for(let li=0;li<nLinks;li++){
          const linkScope=pick(LINK_SCOPES);
          const linkType=pick(LINK_TYPES);
          // V2.6.9: ~30% of links have external "shared with" user — for External Users/Domains KPIs
          const isExternalLink = (linkScope==='ANONYMOUS') || Math.random() < 0.30;
          const extDomains=['gmail.com','outlook.com','partner-corp.com','vendor-inc.com','consultant.io','external-audit.com','contractor.net'];
          const creator=users.length?pick(users):null;
          const creatorEmail=creator?`${normalizeNamePart(creator.f)}.${normalizeNamePart(creator.l)}@${pickEmailDomain(cfg)}`:'user@acme.local';
          const creatorName=creator?`${creator.f} ${creator.l}`:'User';
          // For shared_with fields if schema supports them
          const sharedWithEmail = isExternalLink ? `recipient_${Math.floor(Math.random()*500)}@${pick(extDomains)}` : creatorEmail;
          const sharedWithName = isExternalLink ? `External Recipient` : creatorName;
          const linkCreated=new Date(now-Math.floor(Math.random()*180)*864e5).toISOString().replace("T"," ").slice(0,19);
          const hasExpiry=Math.random()<0.3;
          const expiryDate=hasExpiry?new Date(now+Math.floor(Math.random()*180)*864e5).toISOString().replace("T"," ").slice(0,19):'';
          const shareId=uuid(),itemId=uuid(),siteId=uuid();

          for(const sc of tl){

              if(cl==='role'||cl==='permission_role')return `'${linkType}'`;
              if(cl==='created_time'||cl==='created_date'||cl==='created_at')return `'${linkCreated}'`;
              if(cl==='expiration_time'||cl==='expiry_date'||cl==='expiration_date'||cl==='expires_at')return hasExpiry?`'${expiryDate}'`:`''`;
              if(cl==='created_by'||cl==='created_by_email'||cl==='owner_email')return `'${esc(creatorEmail)}'`;
              if(cl==='created_by_name'||cl==='owner_name')return `'${esc(creatorName)}'`;

  // Phase 4/5: Risk catalog reference data
  if(cfg.ad.enabled){

    // Columns and generation are populated dynamically if schema was discovered, or skipped with a warning.
    if(cfg._schemas&&cfg._schemas.active_directory_risk_catalog){
      const schema=cfg._schemas.active_directory_risk_catalog;
      const cols=schema.map(c=>c.name);
      const RISK_TYPES=[
        // User risks — category MUST contain 'User' for Card 152 filter (risk_category CONTAINS 'User')
        {type:'Stale Users',name:'Stale User Accounts',category:'User',severity:'Medium',desc:'User accounts that have not logged in for 90+ days'},

        {type:'Isolated Users',name:'Isolated Users',category:'User',severity:'Low',desc:'Users not a member of any security group'},

      // Build rows mapping discovered columns to risk data
      const rcRows=[];
      for(const risk of RISK_TYPES){
        const vals=cols.map(col=>{

    R.entities_v2={table:'entities',cols:eCols.join(','),rows:eRows};
    if(classRows.length)R.classifications={table:'classifications',cols:'entityId,classificationScheme,classificationId,classificationName,assignmentMethod,priority,isDeleted,tenancyReference,connectorReference,fullCrawlTimestampUtc,crawlTimestampUtc,contentVersion',rows:classRows};
    onProgress&&onProgress(`v2 Entity model: ${eRows.length} entities, ${classRows.length} classifications`);

    // Principals table — v2.5.1 schema-correct columns
    const userPrincipals=[], wellKnownPrincipals=[];
    if(cfg._schemas.principals){
      const pSchema=cfg._schemas.principals;
      const pCols=pSchema.map(c=>c.name);
      const pRows=[];
      const mkPrincipal=(fields)=>{
        const vals=pCols.map(col=>{

        });
        return `(${vals.join(',')})`;
      };
      if(users.length){
        for(const u of users){
          const pid=uuid();
          // V2.6.13: ~10% of users are Guest (external) — needed for External Users/Domains reports
          const isGuestUser=Math.random()<0.1;
          const EXTERNAL_DOMAINS=['partner-consulting.com','vendorsupply.org','contractor-services.net','audit-firm.com','legal-advisors.co'];

            entityId:uq(pid), sourceTypeId:uq(V2.stAdUser), name:q(`${u.f} ${u.l}`), displayName:q(`${u.f} ${u.l}`),

            isEnabled:u.en?'true':'false', isPrivileged:u.adm?'true':'false',

            createdDate:q(u.cr+'.000000'),                          // when_created — NULL was blocking AD > New Users
            lastActive:u.lastLogon?q(u.lastLogon+'.000000'):'NULL', // for stale account reports
            passwordLastChanged:q(u.pwdLastSet+'.000000'),          // for password risk reports
          }));
        }
        // Well-known security principals — REQUIRED for Open Access / High-Risk ACL / SharingLinks reports
        const wkPrincipals=[
          {name:'Everyone',sid:'S-1-1-0',builtIn:true,sec:true},
          {name:'Authenticated Users',sid:'S-1-5-11',builtIn:true,sec:true},
          {name:'Anonymous Logon',sid:'S-1-5-7',builtIn:true,sec:true},
          {name:'Anonymous',sid:'S-1-5-7-ANON',builtIn:true,sec:true},
          {name:'Everyone except external users',sid:'c:0-.f|rolemanager|spo-grid-all-users|everyone-except-external',builtIn:false,sec:true},
          {name:'Domain Users',sid:`${cfg.global.sidBase}-513`,builtIn:false,sec:true},
          {name:'Domain Admins',sid:`${cfg.global.sidBase}-512`,builtIn:false,sec:true,priv:true},
          {name:'Administrators',sid:'S-1-5-32-544',builtIn:true,sec:true,priv:true},
          {name:'Users',sid:'S-1-5-32-545',builtIn:true,sec:true},
          {name:'SYSTEM',sid:'S-1-5-18',builtIn:true,sec:true},
          {name:'SharingLinks.Anonymous',sid:'c:0(.s|true',builtIn:false,sec:false},
          {name:'SharingLinks.Organization',sid:'c:0-.f|rolemanager|spo-grid-all-users',builtIn:false,sec:false},
          {name:'SharingLinks.Specific',sid:'c:0t.c|tenant|guests',builtIn:false,sec:false},
        ];
        for(const wk of wkPrincipals){
          const pid=uuid();
          wellKnownPrincipals.push({id:pid,sid:wk.sid,name:wk.name,priv:wk.priv});
          // V2.6.12: Add to BOTH principals AND entities tables.
          // entities_all (used by High-Risk ACL report) reads from entities, not principals.
          // Without an entities row, the report's risky_principals CTE finds nothing.
          eRows.push(mkEntity({
            entityId:uq(pid), sourceTypeId:uq(V2.stUnmanaged), name:q(wk.name), displayName:q(wk.name),
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS), sourceReference:uq(V2.tenancy),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6), insertionTimeUtc:q(ts6),
            isDeleted:'false', isContainer:'false', hasContent:'false', isPathRoot:'false',
            pathSegment:q(wk.name),
          }));
          pRows.push(mkPrincipal({
            entityId:uq(pid), sourceTypeId:uq(V2.stUnmanaged), name:q(wk.name), displayName:q(wk.name),
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS), sourceReference:uq(V2.tenancy),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            isDeleted:'false', isContainer:wk.sec?'true':'false', hasContent:'false', isPathRoot:'false',
            pathSegment:q(wk.name),
            sourceSystemId:q(wk.sid), sourceSystemIdType:q('SID'),

        }
      }
      R.principals_v2={table:'principals',cols:pCols.join(','),rows:pRows};
      onProgress&&onProgress(`v2 Principals: ${pRows.length} rows (${userPrincipals.length} users + ${wellKnownPrincipals.length} well-known)`);
    }

    // V2.6.0: Permissions table — explicit SKIP diagnostics + REAL schema with boolean flags + targetEntityId
    if(!cfg._schemas||!cfg._schemas.permissions){
      onProgress&&onProgress("  ⚠ v2 Permissions: SKIPPED — `permissions` schema not discovered. Run Discover Schemas first!");
    }else if(!userPrincipals.length&&!wellKnownPrincipals.length){
      onProgress&&onProgress("  ⚠ v2 Permissions: SKIPPED — no principals available (AD users empty?)");
    }else{
      onProgress&&onProgress("  Generating v2 permissions...");
      const permSchema=cfg._schemas.permissions;
      const permCols=permSchema.map(c=>c.name);
      const permRows=[];
      const mkPerm=(fields)=>{
        const vals=permCols.map(col=>{
          if(fields[col]!==undefined)return fields[col];
          return chDefault((permSchema.find(c=>c.name===col)||{}).type||'');
        });
        return `(${vals.join(',')})`;
      };
      // Permission flag templates — REAL boolean schema
      const PERM_READ={readAllowed:'true', writeAllowed:'false', deleteAllowed:'false', manageAllowed:'false', adminAllowed:'false', listAllowed:'true', limitedAccessAllowed:'true', accessMask:1179817, mask:1179817, role:"'Member'"};
      const PERM_WRITE={readAllowed:'true', writeAllowed:'true', deleteAllowed:'false', manageAllowed:'false', adminAllowed:'false', listAllowed:'true', limitedAccessAllowed:'true', accessMask:1245631, mask:1245631, role:"'Member'"};
      const PERM_FULL={readAllowed:'true', writeAllowed:'true', deleteAllowed:'true', manageAllowed:'true', adminAllowed:'true', listAllowed:'true', limitedAccessAllowed:'true', accessMask:2032127, mask:2032127, role:"'Owner'"};
      const PERM_READWRITE={readAllowed:'true', writeAllowed:'true', deleteAllowed:'true', manageAllowed:'false', adminAllowed:'false', listAllowed:'true', limitedAccessAllowed:'true', accessMask:1180063, mask:1180063, role:"'Member'"};
      const PERM_LIMITED={readAllowed:'false', writeAllowed:'false', deleteAllowed:'false', manageAllowed:'false', adminAllowed:'false', listAllowed:'false', limitedAccessAllowed:'true', accessMask:131209, mask:131209, role:"'Guest'"};
      const PERM_LEVELS=[PERM_READ,PERM_WRITE,PERM_FULL,PERM_READWRITE];

      // Well-known principal lookup
      const everyone=wellKnownPrincipals.find(w=>w.name==='Everyone');
      const authUsers=wellKnownPrincipals.find(w=>w.name==='Authenticated Users');
      const domainUsers=wellKnownPrincipals.find(w=>w.name==='Domain Users');
      const anonymous=wellKnownPrincipals.find(w=>w.name==='Anonymous Logon');
      const anonymousStandalone=wellKnownPrincipals.find(w=>w.name==='Anonymous');
      const everyoneExceptExternal=wellKnownPrincipals.find(w=>w.name==='Everyone except external users');
      const anonLink=wellKnownPrincipals.find(w=>w.name==='SharingLinks.Anonymous');
      const orgLink=wellKnownPrincipals.find(w=>w.name==='SharingLinks.Organization');

      const addPerm=(targetId, principalId, level, connRef, inherited=false)=>{
        permRows.push(mkPerm({
          tenancyReference:uq(V2.tenancy), connectorReference:uq(connRef),
          fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
          targetEntityId:uq(targetId), principalId:uq(principalId),
          permissionGrantId:q(uuid()),
          readAllowed:level.readAllowed, writeAllowed:level.writeAllowed, deleteAllowed:level.deleteAllowed,
          manageAllowed:level.manageAllowed, adminAllowed:level.adminAllowed, listAllowed:level.listAllowed,
          limitedAccessAllowed:level.limitedAccessAllowed,
          aceType:q(inherited?'AccessAllowedInherited':'AccessAllowed'),
          accessMask:level.accessMask, permissionMask:level.mask,
          inheritFlags:inherited?q('ContainerInherit,ObjectInherit'):q('None'),
          propagationFlags:q('None'),
          permissionTypes:'[]',
          memberRole:level.role,
        }));
      };

      // SPO permissions: sites get 3 user principals + maybe orgLink; libraries get 2-3 inherited; docs get 1-2 + maybe Everyone/Anon
      for(const ent of spoSites){
        const nUsers=2+Math.floor(Math.random()*2);
        for(let i=0;i<nUsers&&userPrincipals.length>0;i++)addPerm(ent.id, pick(userPrincipals).id, pick(PERM_LEVELS), V2.connSPO, false);
        if(Math.random()<0.30&&orgLink)addPerm(ent.id, orgLink.id, PERM_READ, V2.connSPO, false);
        if(Math.random()<0.10&&everyone)addPerm(ent.id, everyone.id, PERM_READ, V2.connSPO, false);
      }
      for(const ent of spoLibs){
        const nUsers=2+Math.floor(Math.random()*2);
        for(let i=0;i<nUsers&&userPrincipals.length>0;i++)addPerm(ent.id, pick(userPrincipals).id, pick(PERM_LEVELS), V2.connSPO, true);
        // V2.6.12: ~25% of LIBRARIES get Everyone/AuthUsers/EveryoneExceptExternal — containers need
        // open-access permissions too (not just docs) for Open Access and High-Risk ACL reports
        if(Math.random()<0.25){
          const containerOpenP=pick([everyone,authUsers,everyoneExceptExternal,orgLink].filter(Boolean));
          if(containerOpenP)addPerm(ent.id, containerOpenP.id, PERM_READ, V2.connSPO, false);
        }
        if(Math.random()<0.10){
          const containerRiskyP=pick([everyone,authUsers].filter(Boolean));
          const containerRiskyLvl=pick([PERM_WRITE,PERM_READWRITE,PERM_FULL]);
          if(containerRiskyP)addPerm(ent.id, containerRiskyP.id, containerRiskyLvl, V2.connSPO, false);
        }
      }
      for(const ent of spoDocs){
        const nUsers=1+Math.floor(Math.random()*2);
        for(let i=0;i<nUsers&&userPrincipals.length>0;i++)addPerm(ent.id, pick(userPrincipals).id, pick(PERM_LEVELS), V2.connSPO, true);
        // V2.6.9+12: Boost Open Access rate — include EveryoneExceptExternal + Anonymous standalone
        if(Math.random()<0.25){
          const openP=pick([everyone,anonymous,anonymousStandalone,anonLink,authUsers,everyoneExceptExternal].filter(Boolean));
          if(openP)addPerm(ent.id, openP.id, PERM_READ, V2.connSPO, false);
        }
        // V2.6.9+12: ~15% get HIGH-RISK ACL — Everyone/EveryoneExceptExternal with WRITE or FULL access
        if(Math.random()<0.15){
          const riskyP=pick([everyone,authUsers,everyoneExceptExternal].filter(Boolean));
          const riskyLvl=pick([PERM_WRITE,PERM_READWRITE,PERM_FULL]);
          if(riskyP)addPerm(ent.id, riskyP.id, riskyLvl, V2.connSPO, false);
        }
      }
      // CIFS permissions: shares + files get principals; ~15% of files get Everyone/AuthUsers/DomainUsers (High-Risk ACL)
      for(const ent of cifsShares){
        const nUsers=2+Math.floor(Math.random()*2);
        for(let i=0;i<nUsers&&userPrincipals.length>0;i++)addPerm(ent.id, pick(userPrincipals).id, pick(PERM_LEVELS), V2.connCIFS, false);
      }
      for(const ent of cifsFiles){
        const nUsers=2+Math.floor(Math.random()*2);
        for(let i=0;i<nUsers&&userPrincipals.length>0;i++)addPerm(ent.id, pick(userPrincipals).id, pick(PERM_LEVELS), V2.connCIFS, true);
        if(Math.random()<0.15){
          const riskyP=pick([everyone,authUsers,domainUsers].filter(Boolean));
          if(riskyP)addPerm(ent.id, riskyP.id, PERM_READWRITE, V2.connCIFS, false);
        }
      }
      R.permissions_v2={table:'permissions',cols:permCols.join(','),rows:permRows};
      onProgress&&onProgress(`v2 Permissions: ${permRows.length} grants (${spoSites.length+spoLibs.length+spoDocs.length} SPO + ${cifsShares.length+cifsFiles.length} CIFS entities)`);
    }

    // V2.6.0: Memberships table — explicit SKIP diagnostics
    if(!cfg._schemas||!cfg._schemas.memberships){
      onProgress&&onProgress("  ⚠ v2 Memberships: SKIPPED — `memberships` schema not discovered. Run Discover Schemas first!");
    }else if(!userPrincipals.length){
      onProgress&&onProgress("  ⚠ v2 Memberships: SKIPPED — no user principals");
    }else{
      onProgress&&onProgress("  Generating v2 memberships...");
      const memSchema=cfg._schemas.memberships;
      const memCols=memSchema.map(c=>c.name);
      const memRows=[];
      const mkMem=(fields)=>{
        const vals=memCols.map(col=>{
          if(fields[col]!==undefined)return fields[col];
          return chDefault((memSchema.find(c=>c.name===col)||{}).type||'');
        });
        return `(${vals.join(',')})`;
      };
      // Stable group-type UUIDs (consistent across the dataset)
      const GROUP_TYPE_SECURITY='5cb38a3f-1e8c-4d8c-9b85-5b7e3c8f9a01';
      const GROUP_TYPE_DISTRIBUTION='6dc49b4f-2f9d-5e9d-ac96-6c8f4d9fab02';
      const domainUsersP=wellKnownPrincipals.find(w=>w.name==='Domain Users');
      const adminsP=wellKnownPrincipals.find(w=>w.name==='Administrators');
      const domainAdminsP=wellKnownPrincipals.find(w=>w.name==='Domain Admins');
      const usersP=wellKnownPrincipals.find(w=>w.name==='Users');
      // Every user → Domain Users (direct)
      if(domainUsersP){
        for(const u of userPrincipals){
          memRows.push(mkMem({
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            memberId:uq(u.id), groupId:uq(domainUsersP.id), groupType:uq(GROUP_TYPE_SECURITY),
            membershipSource:q('Direct'), expandedFromGroupId:'NULL',
            role:"'Member'", memberSet:"'Members'",
          }));
        }
      }
      // Admin users → Administrators (direct) + Domain Admins (direct)
      const adminUsersList=userPrincipals.filter(u=>u.isAdmin);
      if(adminsP){
        for(const u of adminUsersList){
          memRows.push(mkMem({
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            memberId:uq(u.id), groupId:uq(adminsP.id), groupType:uq(GROUP_TYPE_SECURITY),
            membershipSource:q('Direct'), expandedFromGroupId:'NULL',
            role:"'Owner'", memberSet:"'Members'",
          }));
        }
      }
      if(domainAdminsP){
        for(const u of adminUsersList){
          memRows.push(mkMem({
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            memberId:uq(u.id), groupId:uq(domainAdminsP.id), groupType:uq(GROUP_TYPE_SECURITY),
            membershipSource:q('Direct'), expandedFromGroupId:'NULL',
            role:"'Owner'", memberSet:"'Members'",
          }));
        }
      }
      // Nested: Domain Admins → Administrators (group nested in group, surfaces as expanded membership)
      if(adminsP&&domainAdminsP){
        for(const u of adminUsersList){
          memRows.push(mkMem({
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connCIFS),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            memberId:uq(u.id), groupId:uq(adminsP.id), groupType:uq(GROUP_TYPE_SECURITY),
            membershipSource:q('Nested'), expandedFromGroupId:uq(domainAdminsP.id),
            role:"'Owner'", memberSet:"'Members'",
          }));
        }
      }
      R.memberships_v2={table:'memberships',cols:memCols.join(','),rows:memRows};
      onProgress&&onProgress(`v2 Memberships: ${memRows.length} rows (${adminUsersList.length} admins)`);
    }

    // V2.6.0: Ownerships table — entity → owner mappings
    if(!cfg._schemas||!cfg._schemas.ownerships){
      onProgress&&onProgress("  ⚠ v2 Ownerships: SKIPPED — `ownerships` schema not discovered");
    }else if(!userPrincipals.length){
      onProgress&&onProgress("  ⚠ v2 Ownerships: SKIPPED — no user principals");
    }else{
      onProgress&&onProgress("  Generating v2 ownerships...");
      const owSchema=cfg._schemas.ownerships;
      const owCols=owSchema.map(c=>c.name);
      const owRows=[];
      const mkOwn=(fields)=>{
        const vals=owCols.map(col=>{
          if(fields[col]!==undefined)return fields[col];
          return chDefault((owSchema.find(c=>c.name===col)||{}).type||'');
        });
        return `(${vals.join(',')})`;
      };
      // Stable ownerType UUIDs (per source family)
      const OWNER_TYPE_USER='9a3e5d8f-7b6c-4e2d-a1f3-8c9d2e4f5a6b';
      const OWNER_TYPE_GROUP='ab4f6e9a-8c7d-5f3e-b2a4-9dae3f5b6c7d';
      // Every SPO doc + CIFS file gets a random user as owner
      const ownableEntities=[
        ...spoDocs.map(e=>({...e,conn:V2.connSPO})),
        ...spoLibs.map(e=>({...e,conn:V2.connSPO})),
        ...cifsFiles.map(e=>({...e,conn:V2.connCIFS})),
        ...cifsShares.filter(e=>!e.nested).map(e=>({...e,conn:V2.connCIFS})),
      ];
      for(const ent of ownableEntities){
        const owner=pick(userPrincipals);
        if(!owner)continue;
        owRows.push(mkOwn({
          entityId:uq(ent.id), ownerId:uq(owner.id), ownerType:uq(OWNER_TYPE_USER),
          isDeleted:'false',
          tenancyReference:uq(V2.tenancy), connectorReference:uq(ent.conn),
          fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6),
        }));
      }
      R.ownerships_v2={table:'ownerships',cols:owCols.join(','),rows:owRows};
      onProgress&&onProgress(`v2 Ownerships: ${owRows.length} entity-owner pairs`);
    }

    // V2.6.0: Permission Sets table — sharing links + role definitions
    // V2.6.12: PST constants hoisted so both permission_sets AND permission_grant_rules blocks can reference them
    const PST_SHARING_LINK='c1d2e3f4-5a6b-7c8d-9e0f-1a2b3c4d5e6f';
    const PST_AZURE_ROLE='d2e3f4a5-6b7c-8d9e-0f1a-2b3c4d5e6f7a';
    if(!cfg._schemas||!cfg._schemas.permission_sets){
      onProgress&&onProgress("  ⚠ v2 Permission Sets: SKIPPED — `permission_sets` schema not discovered");
    }else{
      onProgress&&onProgress("  Generating v2 permission_sets (shared links + role grants)...");
      const psSchema=cfg._schemas.permission_sets;
      const psCols=psSchema.map(c=>c.name);
      const psRows=[];
      const mkPS=(fields)=>{
        const vals=psCols.map(col=>{
          if(fields[col]!==undefined)return fields[col];
          return chDefault((psSchema.find(c=>c.name===col)||{}).type||'');
        });
        return `(${vals.join(',')})`;
      };
      // PST constants defined above (hoisted for permission_grant_rules access)
      // V2.6.12: Linked permissions infrastructure — shared by BOTH doc and container permission_sets
      // Reports like "Shared Link Activity Detail" INNER JOIN permissions ON (targetEntityId, permissionGrantId)
      // so every permission_set MUST have a matching permissions row with the same permissionGrantId
      const docLinkedPermRows=[];
      let mkCLPerm=null;
      let clPermCols=null;
      if(cfg._schemas.permissions){
        const clPermSchema=cfg._schemas.permissions;
        clPermCols=clPermSchema.map(c=>c.name);
        mkCLPerm=(fields)=>{
          const vals=clPermCols.map(col=>{
            if(fields[col]!==undefined)return fields[col];
            return chDefault((clPermSchema.find(c=>c.name===col)||{}).type||'');
          });
          return `(${vals.join(',')})`;
        };
      }
      // ~15% of SPO documents get a sharing link
      for(const ent of spoDocs){
        if(Math.random()<0.15){
          const linkType=pick(['Anonymous','Organization','Flexible']);
          const sharingType=pick(['CanEdit','CanView','CanReview','CannotDownload']);
          const isActive=Math.random()<0.9;
          const allowsAnon=linkType==='Anonymous';
          const hasExpiry=Math.random()<0.4;
          const expDate=hasExpiry?new Date(now.getTime()+(30+Math.floor(Math.random()*180))*864e5).toISOString().replace('T',' ').slice(0,23)+'000':'NULL';
          const createdBy=pick(userPrincipals);
          // V2.6.12: Shared permissionGrantId — same UUID in permission_sets AND permissions
          const sharedDocGrantId=uuid();
          // V2.6.13: Vary createdDate across past 6 months so date-filtered reports show data
          const psDaysAgo=Math.floor(Math.random()*180);
          const psCreatedDate=new Date(now.getTime()-psDaysAgo*864e5).toISOString().replace('T',' ').slice(0,23)+'000';
          psRows.push(mkPS({
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connSPO),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            permissionSetType:uq(PST_SHARING_LINK), targetEntityId:uq(ent.id),
            permissionGrantId:q(sharedDocGrantId), inheritsPermissions:'false',
            createdDate:q(psCreatedDate), modifiedDate:q(psCreatedDate),
            linkType:q(linkType), isActive:isActive?'true':'false',
            allowsAnonymousAccess:allowsAnon?'true':'false',
            requiresPassword:Math.random()<0.2?'true':'false',
            hasExternalGuestInvites:linkType==='Flexible'&&Math.random()<0.5?'true':'false',
            linkExpirationDate:hasExpiry?q(expDate):'NULL',
            sharingType:q(sharingType),
            createdById:createdBy?uq(createdBy.id):'NULL',
            modifiedById:createdBy?uq(createdBy.id):'NULL',
          }));
          // V2.6.12: Linked permission with SAME permissionGrantId — required for Activity Detail
          if(mkCLPerm){
            const linkPrincipal=linkType==='Anonymous'?wellKnownPrincipals.find(w=>w.name==='SharingLinks.Anonymous')
              :linkType==='Organization'?wellKnownPrincipals.find(w=>w.name==='SharingLinks.Organization')
              :pick(userPrincipals);
            if(linkPrincipal){
              const isRead=sharingType==='CanView'||sharingType==='CannotDownload';
              docLinkedPermRows.push(mkCLPerm({
                tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connSPO),
                fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
                targetEntityId:uq(ent.id), principalId:uq(linkPrincipal.id),
                permissionGrantId:q(sharedDocGrantId),
                readAllowed:'true', writeAllowed:isRead?'false':'true',
                deleteAllowed:'false', manageAllowed:'false', adminAllowed:'false',
                listAllowed:'true', limitedAccessAllowed:'true',
                aceType:q('AccessAllowed'), accessMask:isRead?1179817:1245631,
                permissionMask:isRead?1179817:1245631,
                inheritFlags:q('None'), propagationFlags:q('None'),
                permissionTypes:'[]', memberRole:isRead?q('Member'):q('Member'),

            }

      if(docLinkedPermRows.length){
        R.doc_linked_perms={table:'permissions',cols:clPermCols.join(','),rows:docLinkedPermRows};

      }
      // V2.6.12: Container permission_sets — REQUIRED for container_assigned_permissions view
      // which JOINs versioned_permission_sets with versioned_permissions ON (targetEntityId, permissionGrantId)
      // WHERE targetEntityId is a container (isContainer=true). Without these, High-Risk ACL + Open Access = blank.
      const containerLinkedPermRows=[];
      if(mkCLPerm){
        const CONTAINER_PERM_LEVELS=[
          {readAllowed:'true',writeAllowed:'false',deleteAllowed:'false',manageAllowed:'false',adminAllowed:'false',listAllowed:'true',limitedAccessAllowed:'true',accessMask:1179817,mask:1179817,role:"'Member'"},
          {readAllowed:'true',writeAllowed:'true',deleteAllowed:'false',manageAllowed:'false',adminAllowed:'false',listAllowed:'true',limitedAccessAllowed:'true',accessMask:1245631,mask:1245631,role:"'Member'"},
          {readAllowed:'true',writeAllowed:'true',deleteAllowed:'true',manageAllowed:'true',adminAllowed:'true',listAllowed:'true',limitedAccessAllowed:'true',accessMask:2032127,mask:2032127,role:"'Owner'"},
        ];
        const riskyPrincipalsForContainers=[
          wellKnownPrincipals.find(w=>w.name==='Everyone'),
          wellKnownPrincipals.find(w=>w.name==='Authenticated Users'),
          wellKnownPrincipals.find(w=>w.name==='Everyone except external users'),
          wellKnownPrincipals.find(w=>w.name==='SharingLinks.Anonymous'),
          wellKnownPrincipals.find(w=>w.name==='SharingLinks.Organization'),
        ].filter(Boolean);
        // ~30% of libraries + ~20% of sites get container-level sharing links with risky principals
        const containerTargets=[...spoLibs.map(l=>({...l,type:'lib'})),...spoSites.map(s=>({...s,type:'site'}))];
        for(const ct of containerTargets){
          const rate=ct.type==='lib'?0.30:0.20;
          if(Math.random()<rate&&riskyPrincipalsForContainers.length>0){
            const sharedGrantId=uuid(); // SAME permissionGrantId in BOTH permission_sets AND permissions
            const riskyP=pick(riskyPrincipalsForContainers);
            const linkType=pick(['Anonymous','Organization','Flexible']);
            const sharingType=pick(['CanEdit','CanView','CanReview']);
            const isAnon=linkType==='Anonymous';
            const permLevel=pick(CONTAINER_PERM_LEVELS);
            // V2.6.13: Vary createdDate across past 6 months
            const cPsDaysAgo=Math.floor(Math.random()*180);
            const cPsCreatedDate=new Date(now.getTime()-cPsDaysAgo*864e5).toISOString().replace('T',' ').slice(0,23)+'000';
            // permission_sets entry for this container
            psRows.push(mkPS({
              tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connSPO),

              permissionSetType:uq(PST_SHARING_LINK), targetEntityId:uq(ct.id),

              linkType:q(linkType), isActive:'true',
              allowsAnonymousAccess:isAnon?'true':'false',
              requiresPassword:'false',
              hasExternalGuestInvites:linkType==='Flexible'?'true':'false',
              linkExpirationDate:'NULL',
              sharingType:q(sharingType),
            }));
            // LINKED permissions entry with SAME permissionGrantId + risky principal
            containerLinkedPermRows.push(mkCLPerm({
              tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connSPO),
              fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
              targetEntityId:uq(ct.id), principalId:uq(riskyP.id),
              permissionGrantId:q(sharedGrantId),
              readAllowed:permLevel.readAllowed, writeAllowed:permLevel.writeAllowed,
              deleteAllowed:permLevel.deleteAllowed, manageAllowed:permLevel.manageAllowed,
              adminAllowed:permLevel.adminAllowed, listAllowed:permLevel.listAllowed,
              limitedAccessAllowed:permLevel.limitedAccessAllowed,
              aceType:q('AccessAllowed'), accessMask:permLevel.accessMask,
              permissionMask:permLevel.mask,
              inheritFlags:q('ContainerInherit,ObjectInherit'), propagationFlags:q('None'),
              permissionTypes:'[]', memberRole:permLevel.role,
            }));
          }
        }
        if(containerLinkedPermRows.length){
          R.container_linked_perms={table:'permissions',cols:clPermCols.join(','),rows:containerLinkedPermRows};
          onProgress&&onProgress(`  Container linked permissions: ${containerLinkedPermRows.length} risky grants on containers`);
        }
      }
      R.permission_sets_v2={table:'permission_sets',cols:psCols.join(','),rows:psRows};
      onProgress&&onProgress(`v2 Permission Sets: ${psRows.length} sharing links generated`);
    }

    // V2.6.12: Seed permission_grant_rules — this table was EMPTY causing every report
    // that INNER JOINs versioned_permission_sets → permission_grant_rules to return 0 rows.
    // We seed it with the permission set types we reference from permission_sets.
    if(!cfg._schemas||!cfg._schemas.permission_grant_rules){
      onProgress&&onProgress("  ⚠ permission_grant_rules: SKIPPED — schema not discovered");
    }else{
      onProgress&&onProgress("  Seeding permission_grant_rules (sharing link + role types)...");
      const pgrSchema=cfg._schemas.permission_grant_rules;
      const pgrCols=pgrSchema.map(c=>c.name);
      const pgrRows=[];
      const mkPGR=(fields)=>{
        const vals=pgrCols.map(col=>{
          if(fields[col]!==undefined)return fields[col];
          return chDefault((pgrSchema.find(c=>c.name===col)||{}).type||'');
        });
        return `(${vals.join(',')})`;
      };
      // SharePoint sharing link permission set type — matches PST_SHARING_LINK in permission_sets
      pgrRows.push(mkPGR({
        permissionSetType:uq(PST_SHARING_LINK),
        typeName:q('SharePointShareLinkPermissionSet'),
        passesThroughToDescendants:'true',
        isAnonymous:'false',
        activeCheckColumn:q('isActive'),
        orgPolicyScopeKey:q(''),
      }));
      // Azure role permission set type — matches PST_AZURE_ROLE
      pgrRows.push(mkPGR({
        permissionSetType:uq(PST_AZURE_ROLE),
        typeName:q('AzureRolePermissionSet'),
        passesThroughToDescendants:'false',
        isAnonymous:'false',
        activeCheckColumn:q(''),
        orgPolicyScopeKey:q(''),
      }));
      // Direct NTFS permission set type — for CIFS reports
      const PST_NTFS='e3f4a5b6-7c8d-9e0f-1a2b-3c4d5e6f7a8b';
      pgrRows.push(mkPGR({
        permissionSetType:uq(PST_NTFS),
        typeName:q('NtfsPermissionSet'),
        passesThroughToDescendants:'true',
        isAnonymous:'false',
        activeCheckColumn:q(''),
        orgPolicyScopeKey:q(''),
      }));
      // SharePoint direct permission set type
      const PST_SPO_DIRECT='f4a5b6c7-8d9e-0f1a-2b3c-4d5e6f7a8b9c';
      pgrRows.push(mkPGR({
        permissionSetType:uq(PST_SPO_DIRECT),
        typeName:q('SharePointDirectPermissionSet'),
        passesThroughToDescendants:'true',
        isAnonymous:'false',
        activeCheckColumn:q(''),
        orgPolicyScopeKey:q(''),
      }));
      R.permission_grant_rules_v2={table:'permission_grant_rules',cols:pgrCols.join(','),rows:pgrRows};
      onProgress&&onProgress(`  permission_grant_rules: ${pgrRows.length} rule types seeded`);
    }

    // V2.6.0: Sensitive Data v2 (generic unified table — entity-keyed, not source-specific)
    if(!cfg._schemas||!cfg._schemas.sensitive_data){
      onProgress&&onProgress("  ⚠ v2 Sensitive Data: SKIPPED — `sensitive_data` schema not discovered");
    }else{
      onProgress&&onProgress("  Generating v2 sensitive_data...");
      const sdSchema=cfg._schemas.sensitive_data;
      const sdCols=sdSchema.map(c=>c.name);
      const sdRows=[];
      const mkSD=(fields)=>{
        const vals=sdCols.map(col=>{
          if(fields[col]!==undefined)return fields[col];
          return chDefault((sdSchema.find(c=>c.name===col)||{}).type||'');
        });
        return `(${vals.join(',')})`;
      };
      const ACTIONS=['upgrade','keep','downgrade','none'];
      const LABELS=['Confidential','Internal','Public','Highly Confidential','Restricted'];
      // ~25% of SPO docs + CIFS files get sensitive data matches
      const sensitiveCandidates=[...spoDocs,...cifsFiles];
      for(const ent of sensitiveCandidates){
        if(Math.random()<0.25){
          const m=pickSdMatch(cfg);
          const matches=`[('${esc(m.groupName)}','${esc(m.patternName)}')]`;
          const hasLabel=Math.random()<0.6;
          const labelName=hasLabel?pick(LABELS):'';
          sdRows.push(mkSD({
            tenancyReference:uq(V2.tenancy), connectorReference:uq(V2.connSPO),
            fullCrawlTimestampUtc:q(ts6), crawlTimestampUtc:q(ts6), lastModified:q(ts6),
            entityId:uq(ent.id),
            matches:matches,
            processingTimeSeconds:(Math.random()*2).toFixed(3),
            classificationMethod:"'SDK_AUTO'",
            mipIsProtected:hasLabel?'true':'false',
            taxonomyId:uq(uuid()),
            action:hasLabel?"'"+pick(ACTIONS)+"'":"'none'",
            labelId:hasLabel?uq(uuid()):'NULL',
            labelName:hasLabel?q(labelName):'NULL',
            reason:hasLabel?q('Matched '+m.groupName+' policy'):'NULL',
            decisionTimestamp:q(ts6),
            appliedAt:hasLabel?q(ts6):'NULL',
            applyError:q(''),
            applyAttempts:hasLabel?1:0,
          }));
        }
      }
      R.sensitive_data_v2={table:'sensitive_data',cols:sdCols.join(','),rows:sdRows};
      onProgress&&onProgress(`v2 Sensitive Data: ${sdRows.length} entity sensitivity records`);
    }
  }else{
    onProgress&&onProgress("v2 Entity model: SKIPPED — schema not discovered. Use 'Discover Schemas' on Connection tab.");
  }
  await tick();

  // Crawl completions — critical for entities_hier_dict dictionary reload and SPO report views
  if(cfg._schemas&&cfg._schemas.crawl_completions){
    onProgress&&onProgress("Generating crawl completions...");await tick();
    const ccSchema=cfg._schemas.crawl_completions;
    const ccCols=ccSchema.map(c=>c.name);
    const ccRows=[];
    // Generate completion records with proper tenancy+connector references
    // These must match the entities we injected so the dictionary source query can find them
    const V2Refs=(typeof V2!=='undefined'&&V2)?V2:{tenancy:'6eb91557-365d-466a-92da-10a244c29cd5',connSPO:'82a27ca6-958b-4ba1-ba12-ed913e85238b',connFS:'b5d5cf51-2dbd-4992-bf2b-6c3e41d51b37'};
    const CRAWL_SOURCES=[
      {sourceRef:V2Refs.connSPO||'82a27ca6-958b-4ba1-ba12-ed913e85238b', type:'sharepoint_online'},
      {sourceRef:V2Refs.connFS||'b5d5cf51-2dbd-4992-bf2b-6c3e41d51b37', type:'cifs'},
    ];
    for(const src of CRAWL_SOURCES){
      for(const sc of tl){
        const vals=ccCols.map(col=>{
          const cl=col.toLowerCase();
          // Tenancy + source references for entity model dictionary
          if(cl==='tenancyreference'||cl==='tenancy_reference')return `'${V2Refs.tenancy||'6eb91557-365d-466a-92da-10a244c29cd5'}'`;
          if(cl==='sourcereference'||cl==='source_reference'||cl==='connectorreference')return `'${src.sourceRef}'`;
          // Timestamps
          if(cl==='fullcrawltimestamputc'||cl==='full_crawl_timestamp_utc'||cl==='scanned_at')return `'${sc.ts}'`;
          if(cl==='completedat'||cl==='completed_at'){
            const fin=new Date(new Date(sc.ts.replace(' ','T')+'Z').getTime()+Math.floor(Math.random()*3600000));
            return `'${fin.toISOString().replace("T"," ").slice(0,19)}'`;
          }
          // Legacy fields
          if(cl==='scan_id')return `'${sc.sid}'`;
          if(cl==='scan_execution_id')return `'${sc.eid}'`;
          if(cl==='source_type'||cl==='data_source_type'||cl==='type'||cl==='crawler_type')return `'${src.type}'`;
          if(cl==='status'||cl==='crawl_status')return `'COMPLETED'`;
          if(cl==='started_at'||cl==='start_time')return `'${sc.ts}'`;
          if(cl==='finished_at'||cl==='end_time'||cl==='completed_time'){
            const fin=new Date(new Date(sc.ts.replace(' ','T')+'Z').getTime()+Math.floor(Math.random()*3600000));
            return `'${fin.toISOString().replace("T"," ").slice(0,19)}'`;
          }
          if(cl==='objects_scanned'||cl==='total_objects'||cl==='item_count')return `${100+Math.floor(Math.random()*2000)}`;
          if(cl==='errors'||cl==='error_count')return '0';
          if(cl==='is_complete'||cl==='completed')return 'true';
          if(cl==='hard_delete')return 'false';
          return chDefault((ccSchema.find(c=>c.name===col)||{}).type||'');
        });
        ccRows.push(`(${vals.join(',')})`);
      }
    }
    if(ccRows.length){
      R.crawl_completions={table:'crawl_completions',cols:ccCols.join(','),rows:ccRows};
      onProgress&&onProgress(`Crawl completions: ${ccRows.length} records (${CRAWL_SOURCES.length} sources × ${tl.length} scans)`);
    }
  }

  return R;
}
function buildSQL(R,db="access_analyzer"){const G={};for(const[k,v]of Object.entries(R)){if(!v.table)continue;if(!G[v.table])G[v.table]={c:v.cols,r:[]};G[v.table].r=G[v.table].r.concat(v.rows);}
const F={};for(const[t,d]of Object.entries(G)){let s=`-- ${t}: ${d.r.length} rows\n\n`;for(let i=0;i<d.r.length;i+=500){s+=`INSERT INTO ${db}.${t} (${d.c}) VALUES\n${d.r.slice(i,i+500).join(",\n")};\n\n`;}F[`${t}.sql`]=s;}return F;}

/* ─── ClickHouse HTTP Client ──────────────────────────── */
async function chQuery(cfg, sql) {
  const {ch_host, ch_port, ch_user, ch_pass} = cfg.connection;
  const url = `http://${ch_host}:${ch_port}/?database=access_analyzer&user=${encodeURIComponent(ch_user)}&password=${encodeURIComponent(ch_pass)}`;
  const resp = await fetch(url, {method: 'POST', body: sql, mode: 'cors'});
  if (!resp.ok) { const t = await resp.text(); throw new Error(`CH ${resp.status}: ${t.slice(0,200)}`); }
  return await resp.text();
}
async function chTest(cfg) {
  try { const r = await chQuery(cfg, "SELECT currentUser() as u, version() as v"); return {ok:true, data:r.trim()}; }
  catch(e) { return {ok:false, error:e.message}; }
}
async function chGrant(cfg) {
  try { await chQuery(cfg, "GRANT INSERT, TRUNCATE, ALTER DELETE, ALTER UPDATE ON access_analyzer.* TO access_analyzer_metabase"); return {ok:true}; }
  catch(e) { return {ok:false, error:e.message}; }
}

// Metabase API injection (preferred path — no CORS issues)
async function mbInject(cfg, sql) {
  const sid = cfg.connection._mbSession;
  if (!sid) throw new Error("No Metabase session. Connect first.");
  const resp = await fetch(cfg.connection.url + '/metabase/api/dataset', {
    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
    body:JSON.stringify({database:cfg.connection.databaseId||2, type:'native', native:{query:sql}})
  });
  const d = await resp.json();
  if (d.status==='failed' && d.error && d.error.indexOf('ResultSet')>=0) return {ok:true};
  if (d.status==='failed') throw new Error(d.error);
  return {ok:true, data:d.data};
}

// Schema discovery — queries ClickHouse system.columns for unknown tables
async function mbDiscoverSchema(cfg, tableName) {
  const sid = cfg.connection._mbSession;
  if (!sid) throw new Error("No Metabase session");
  const sql = `SELECT name, type, default_kind FROM system.columns WHERE table='${tableName}' AND database='access_analyzer' ORDER BY position`;
  const resp = await fetch(cfg.connection.url + '/metabase/api/dataset', {
    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
    body:JSON.stringify({database:cfg.connection.databaseId||2, type:'native', native:{query:sql}})
  });
  const d = await resp.json();
  if (d.status==='failed') throw new Error(d.error||'Query failed');
  if (!d.data||!d.data.rows||d.data.rows.length===0) return null;
  // Filter out MATERIALIZED and ALIAS columns — they can't be inserted
  return d.data.rows
    .filter(r => !r[2] || (r[2]!=='MATERIALIZED' && r[2]!=='ALIAS'))
    .map(r=>({name:r[0],type:r[1]}));
}

async function mbDiscoverAllSchemas(cfg) {
  const tables = ['active_directory_risk_catalog','entities','principals','permissions','memberships','system_objects','permission_sets','permission_grant_rules','ownerships','sensitive_data','netwrix_activity_monitor_copilot','netwrix_activity_monitor_ad','netwrix_activity_monitor_entra','sharepoint_online_shared_links','crawl_completions'];
  const schemas = {};
  for (const t of tables) {
    try {
      const s = await mbDiscoverSchema(cfg, t);
      if (s) schemas[t] = s;
    } catch(e) { /* table may not exist */ }
  }
  return schemas;
}

// v2.5.2: Full-database introspection — lists EVERY table in access_analyzer with row counts + columns
// Use this to find tables we haven't accounted for (Copilot, Entra ID, M365 audit, materialized views, etc.)
async function mbDiscoverEverything(cfg, onProgress) {
  const sid = cfg.connection._mbSession;
  if (!sid) throw new Error("No Metabase session");
  const runSql = async (sql) => {
    const resp = await fetch(cfg.connection.url + '/metabase/api/dataset', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body:JSON.stringify({database:cfg.connection.databaseId||2, type:'native', native:{query:sql}})
    });
    const d = await resp.json();
    if (d.status==='failed') throw new Error(d.error||'Query failed');
    return d.data && d.data.rows ? d.data.rows : [];
  };

  onProgress&&onProgress("Listing all tables...");
  // Get all tables + row counts + engine + size
  const tableRows = await runSql(
    `SELECT name, total_rows, total_bytes, engine FROM system.tables WHERE database='access_analyzer' ORDER BY name`
  );
  onProgress&&onProgress(`Found ${tableRows.length} tables. Fetching all columns in one query...`);

  // Get ALL columns for ALL tables in ONE query (way faster than per-table)
  const colRows = await runSql(
    `SELECT table, name, type, default_kind, position FROM system.columns WHERE database='access_analyzer' ORDER BY table, position`
  );
  onProgress&&onProgress(`Got ${colRows.length} columns. Building report...`);

  // Group columns by table
  const colsByTable = {};
  for (const r of colRows) {
    const [tbl, name, type, defKind] = r;
    if (!colsByTable[tbl]) colsByTable[tbl] = [];
    // Skip MATERIALIZED/ALIAS — they can't be inserted
    if (defKind === 'MATERIALIZED' || defKind === 'ALIAS') continue;
    colsByTable[tbl].push({name, type});
  }

  // V2.7.1: Tables our generator knows how to populate (base tables only).
  // Anything that's a View, MaterializedView, Dictionary, or derivative (_latest, _mv, etc.)
  // is excluded from "unknown" since AA26 populates those automatically from our base data.
  const KNOWN_TABLES = new Set([
    'active_directory_user','active_directory_group','active_directory_group_membership','active_directory_effective_group_membership','active_directory_risk_catalog',
    'cifs_object','cifs_permission','cifs_share_permission','cifs_sensitive_data',
    'sharepoint_online_objects','sharepoint_online_permissions','sharepoint_online_shared_links','sharepoint_sensitive_data',
    'netwrix_activity_monitor_json','netwrix_activity_monitor_spo','netwrix_activity_monitor_copilot',
    'localgroups_group','localgroups_user','localgroups_group_members','localgroups_effective_group_membership',
    'entities','principals','permissions','permission_sets','permission_grant_rules','memberships','ownerships','sensitive_data','classifications','crawl_completions','system_objects',
    // V2.7.1: AA26-shipped seed tables — ship with data, we don't populate but they're not gaps
    'domain_type_properties','path_metadata','permission_calc_rules','source_type_registry','source_settings',
    // Optional features we don't currently demo but don't block any reports
    'active_directory_user_custom_attribute','netwrix_activity_monitor_leef',
    // v3.1.4: generators added this pass — confirmed real gaps, not false positives like the three below
    'netwrix_activity_monitor_ad','netwrix_activity_monitor_entra',
    // v3.1.3: confirmed live against AA26 v1.1.5 — companion base table to cifs_latest_scan_execution_mv,
    // auto-populated from cifs_object/cifs_permission inserts, same as every other _latest/_mv pair
    'cifs_latest_scan_execution',
    // v3.1.3: "_pre_v2" tables are superseded by sharepoint_sensitive_data post-migration (this env has
    // applied 32 schema migrations per its schema_versions table) — legacy, not a population target
    'sharepoint_sensitive_data_mip_labels_pre_v2','sharepoint_sensitive_data_pre_v2',
  ]);


  // Build the final report — filter out tables that are derivatives/internals, not base tables
  const allTableNames = tableRows.map(r => r[0]);
  const unknownTables = tableRows.filter(r => {
    const name = r[0];
    const engine = r[3] || '';
    // Skip if in known list
    if (KNOWN_TABLES.has(name)) return false;
    // Skip ClickHouse internals
    if (name.startsWith('.inner') || name.startsWith('_tmp_')) return false;
    // Skip views, MVs, dictionaries — these derive from base tables AA26 manages automatically
    if (engine === 'View' || engine === 'MaterializedView' || engine === 'LiveView' || engine === 'Dictionary') return false;
    // Skip naming conventions for derivatives that AA26 maintains
    if (/_latest$|_mv$|_resolved$|_summary$|_summary_mv$|_by_domain$|_by_domain_mv$|_with_path$|_member_counts$|_mip_labels(_latest|_summary)?$/.test(name)) return false;
    // Skip schema/version tracking
    if (name === 'schema_migrations' || name === 'schema_versions') return false;
    return true;
  }).map(r => r[0]);
  const report = {
    database: 'access_analyzer',
    totalTables: tableRows.length,
    totalColumns: colRows.length,
    summary: {
      populated: tableRows.filter(r => Number(r[1])>0).length,
      empty: tableRows.filter(r => !r[1] || Number(r[1])===0).length,
      copilotTables: tableRows.filter(r => /copilot/i.test(r[0])).map(r=>r[0]),
      m365Tables: tableRows.filter(r => /m365|microsoft365|entra|azure_ad/i.test(r[0])).map(r=>r[0]),
      materializedViews: tableRows.filter(r => r[3]==='MaterializedView').map(r=>r[0]),
      dictionaries: tableRows.filter(r => r[3]==='Dictionary').map(r=>r[0]),
      unknownTables: unknownTables,
    },
    tables: tableRows.map(r => ({
      name: r[0],
      rowCount: r[1] ? Number(r[1]) : 0,
      bytes: r[2] ? Number(r[2]) : 0,
      engine: r[3],
      columns: colsByTable[r[0]] || [],
    })),
  };
  return report;
}

// Queries live system.columns for the tables above and reports, per table, which columns this
// app expects to write to that are MISSING on the connected instance (the failure mode that
// actually breaks an INSERT — new/extra live columns are harmless and not flagged). This is a
// detection tool, not an auto-fixer: it tells you exactly what's missing so you (or a Claude
// session) can go fix the specific generator line — it doesn't rewrite code itself.
async function runSchemaCompatibilityCheck(cfg) {
  const tables = Object.keys(EXPECTED_SCHEMA_CHECK);
  const inList = tables.map(t=>`'${t}'`).join(',');
  const r = await fetch(cfg.connection.url+'/metabase/api/dataset', {
    method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
    body: JSON.stringify({database:cfg.connection.databaseId||2, type:'native', native:{query:`SELECT table, name FROM system.columns WHERE database='access_analyzer' AND table IN (${inList})`}})
  });
  const j = await r.json();
  if (!j.data || !j.data.rows) throw new Error('Schema query failed — could not read system.columns');
  const liveCols = {};
  for (const [t, n] of j.data.rows) { (liveCols[t] = liveCols[t]||[]).push(n); }
  return tables.map(t => {
    const exp = EXPECTED_SCHEMA_CHECK[t].split(',');
    const live = new Set(liveCols[t]||[]);
    const missing = exp.filter(c=>!live.has(c));
    const extra = (liveCols[t]||[]).filter(c=>!exp.includes(c));
    const tableExists = !!liveCols[t];
    return { table: t, tableExists, missing, extra, ok: tableExists && missing.length===0 };
  });
}

// v3.2.2: discover the REAL source-type UUIDs for whatever AA26 instance we're connected to —
// these are environment-specific and change between installs/versions (confirmed: this AA26
// version dropped plain "entra-id"/"sharepoint" in favor of *-ccf variants, and added a new
// "file-server-discover" type). "localgroups" stays hidden from this listing in every version
// seen so far, so it's intentionally left out of the returned map — callers should treat a
// missing key as "not creatable via API in this environment", not retry with a guessed UUID.
async function aa26DiscoverSourceTypes(cfg) {
  const r = await aa26Fetch(cfg, "/api/v1/source-types");
  if (!r.ok) throw new Error(`source-types discovery failed: HTTP ${r.status}`);
  const list = r.body?.data || (Array.isArray(r.body) ? r.body : []);
  const map = {};
  for (const st of list) if (st?.name && st?.id) map[st.name] = st.id;
  return map;
}

async function aa26Fetch(cfg, path, opts={}) {
  const host = cfg.connection?.aa26Host || cfg.connection.host;
  const cookie = cfg.connection?.aa26SessionCookie || "";
  // V2.8.0-alpha refinement: same-origin auto-mode — browser auto-attaches cookies
  const isSameOrigin = typeof window !== "undefined" && window.location.hostname === host;
  if (!cookie && !isSameOrigin) throw new Error("AA session cookie not set (or host this app on the AA origin for auto-auth)");
  const url = isSameOrigin ? path : `https://${host}${path}`;
  const headers = { "Content-Type":"application/json", ...(opts.headers||{}) };
  // Only set Cookie header in cross-origin mode (browser blocks setting it manually otherwise)
  if (!isSameOrigin && cookie) headers["Cookie"] = `_dspm_session=${cookie}`;
  const r = await fetch(url, {
    method: opts.method || "GET",
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: "include",
  });
  const txt = await r.text();
  let body=null; try{ body=JSON.parse(txt); }catch{ body=txt; }
  return { status: r.status, ok: r.ok, body };
}

// v3.2.0: AA26's GraphQL endpoint (separate from the REST /api/v1/* surface, same-origin
// _dspm_session cookie auth). Used to discover the real Sensitive Data Pattern Groups/Patterns
// catalog — confirmed live via Apollo cache inspection (introspection is disabled server-side).
async function aa26GraphQL(cfg, query, variables) {
  const host = cfg.connection?.aa26Host || cfg.connection.host;
  const isSameOrigin = typeof window !== "undefined" && window.location.hostname === host;
  const url = isSameOrigin ? "/graphql" : `https://${host}/graphql`;
  const r = await fetch(url, {
    method: "POST", credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, variables }),
  });
  const j = await r.json();
  if (j.errors) throw new Error(j.errors.map(e=>e.message).join("; "));
  return j.data;
}

// v3.2.0: Discover the real Sensitive Data Pattern Groups + Patterns from this AA26 instance.
// Confirmed live against AA26 v1.1.5: 11 built-in groups (CCPA, CMMC, Credentials, Financial
// Records, GDPR, GDPR Restricted, GLBA, HIPAA, PCI DSS, PHI, PII), 139 built-in patterns, each
// with a real regex and confidence level. Users can also add custom groups/patterns in AA26
// itself — this discovery call picks those up too, no code change needed on our end.
async function aa26DiscoverSensitiveDataCatalog(cfg) {
  const groupsQ = `query($page:Int,$pageSize:Int){ sensitiveDataPatternGroups(page:$page,pageSize:$pageSize){ data{ id name } } }`;
  const patQ = `query($page:Int,$pageSize:Int){ sensitiveDataPatterns(page:$page,pageSize:$pageSize){ data{ id name confidence groups{ id name } } } }`;
  const gData = await aa26GraphQL(cfg, groupsQ, {page:1, pageSize:200});
  const groups = gData.sensitiveDataPatternGroups.data;
  let patterns = [];
  for (let page=1; page<=10; page++) {
    const pData = await aa26GraphQL(cfg, patQ, {page, pageSize:100});
    const batch = pData.sensitiveDataPatterns.data;
    patterns = patterns.concat(batch);
    if (batch.length < 100) break; // last page
  }
  // Flatten to { groupName: [{name, confidence}] } for easy consumption by the generator
  const byGroup = {};
  for (const g of groups) byGroup[g.name] = [];
  for (const p of patterns) {
    for (const g of (p.groups||[])) {
      if (byGroup[g.name]) byGroup[g.name].push({ name: p.name, confidence: p.confidence });
    }
  }
  return { groups: groups.map(g=>g.name), byGroup, patternCount: patterns.length };
}

// V2.8.0: Simulate a completed scan execution for the given scan_id.
// API gotcha: timestamps and object counts are server-controlled and ignored on input.
// The state machine requires pending -> running -> completed transitions in sequence.
// v3.1.2: field renamed scan_id -> scanId by inference (matches the confirmed camelCase
// rewrite of /api/v1/scans), NOT independently confirmed live — the rest of the Scan
// creation flow was verified against the real API this pass, but no scan was actually
// run to completion, so this endpoint's exact shape is still unverified. Test this
// specific call against a real scan before trusting it end-to-end.
// v3.3.5: scan ID reading was fixed (real IDs confirmed for both create and exists paths).
// v3.3.6: with a genuinely real, freshly-created scan ID confirmed live, execution creation
// STILL 404s — tried flat POST, nested /scans/:id/executions, /scans/:id/scan-executions,
// wrapped {execution:{}}/{scanExecution:{}} bodies, snake_case scan_id, and OPTIONS (which
// returned 404 with no Allow header at all, the strongest signal). Conclusion: this AA version
// does not expose a way to create a scan-execution via the REST API — not a payload-shape bug,
// a capability gap. GET on the collection works fine (200, real data), only creation is missing/
// not routed. Left the attempt in (harmless, and picks it back up automatically if a future AA
// version restores it) but the error message below reflects this finding instead of inviting
// another round of guessing the request shape.
async function aa26SimulateExecution(cfg, scanId, scanType) {
  if (!scanId) return { ok:false, error:`no scan ID provided — skipping rather than sending a malformed request` };
  const create = await aa26Fetch(cfg, "/api/v1/scan-executions", { method:"POST", body: { scanId: scanId } });
  if (!create.ok) {
    if (create.status === 404 && !create.body) {
      return { ok:false, error:`HTTP 404 (empty body) — confirmed this AA version doesn't support creating scan-executions via REST API at all (checked multiple paths/payload shapes/OPTIONS live). Not fixable from this side; Scan Executions page will stay empty until a real scan runs, or until this is populated directly via Postgres (would need scan_executions table schema — not yet investigated).` };
    }
    return { ok:false, error:`create failed: ${create.status} ${JSON.stringify(create.body).slice(0,120)}` };
  }
  const execId = create.body?.id || create.body?.data?.id || create.body?.execution?.id || create.body?.scanExecution?.id;
  if (!execId) return { ok:false, error:`created but couldn't find execution ID in response: ${JSON.stringify(create.body).slice(0,150)}` };
  const toRunning = await aa26Fetch(cfg, `/api/v1/scan-executions/${execId}`, { method:"PATCH", body: { status: "running" } });
  if (!toRunning.ok) return { ok:false, error:`pending→running failed: ${toRunning.status}`, execId };
  const toCompleted = await aa26Fetch(cfg, `/api/v1/scan-executions/${execId}`, { method:"PATCH", body: { status: "completed" } });
  if (!toCompleted.ok) return { ok:false, error:`running→completed failed: ${toCompleted.status}`, execId };
  return { ok:true, execId };
}
